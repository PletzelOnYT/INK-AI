<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>INK AI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
main{width:min(96vw,1300px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0}
.tools{display:flex;align-items:center;justify-content:center;gap:3px;align-self:center;padding:5px;background:#1b1b1b;border:1px solid #404040;border-radius:16px;box-shadow:0 6px 20px #0006}
.tool{width:48px;height:46px;display:grid;place-items:center;background:transparent;color:#ccc;border:0;border-radius:12px;cursor:pointer;transition:background .1s,color .1s}
.tool:hover{background:#343434;color:#fff}
.tool[aria-pressed="true"]{background:#fff;color:#0c0c0c}
.tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:focus-visible{outline:2px solid white;outline-offset:2px}
#pad[data-tool="eraser"]{cursor:cell}

/* The prediction layer is never part of the saved/recognized ink. */
.board{position:relative;width:100%;aspect-ratio:1200/550;background:#fff;border-radius:14px;overflow:hidden}
.board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ghost{pointer-events:none;z-index:2}
#pad{z-index:1}
.tool.assist-on{background:#ececec;color:#0b0b0b}
@media(max-width:650px){.board{aspect-ratio:1.14/1;border-radius:9px}}


#pad{background:#fff;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.correction-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:42px;padding:9px 16px;border:1px solid #303030;border-radius:11px;background:#171717;color:#c7c7c7;font-size:14px}
.correction-bar button{flex-shrink:0;border:1px solid #5b73a8;background:#274b96;color:#fff;border-radius:9px;padding:9px 16px;font:inherit;cursor:pointer}
.correction-bar button:disabled{opacity:.35;cursor:default}
.correction-bar kbd{font:inherit;font-weight:700}
@media(max-width:650px){.correction-bar{align-items:flex-start;flex-direction:column;gap:9px}}
#guess{min-height:95px;padding:18px 20px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;color:#fff;font-size:clamp(24px,3vw,43px);font-weight:570;line-height:1.25;letter-spacing:-.02em}
#guess[data-muted="true"]{color:#8e8e8e;font-size:clamp(15px,2vw,23px);font-weight:400;letter-spacing:0}
@media(max-width:650px){main{padding:10px 0;gap:8px;justify-content:start}#pad{border-radius:0}#guess{min-height:80px}}
</style>
</head>

    <button id="assist" class="tool" type="button" aria-label="Full character auto-correct" title="Recognize and correct entire handwritten letters · G accepts" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17Z"/></svg></button>

<script>
"use strict";
(() => {
const MODEL_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v1.json";
const RECOGNITION_V2_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v2.json";
const RECOGNITION_V3_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v3.json";
const canvas=document.getElementById("pad"), ctx=canvas.getContext("2d",{willReadFrequently:true}), guess=document.getElementById("guess");
const ghostCanvas=document.getElementById("ghost"),ghostCtx=ghostCanvas.getContext("2d");
const assistButton=document.getElementById("assist");
let strokes=[],current=null,pointer=null,worker=null,loaded=false,requestId=0,readVersion=0,readTimer=0,tool="pen";
let assistEnabled=false,ghostCandidate=null;
const requests=new Map();
window.__inkReady=false;
window.__inkEngine="cnn";
window.__inkRecognitionVersion=0;
window.__inkRecognitionAccuracy=0;
window.__inkDetectedRegions=0;
window.__inkStrokeAwareSplits=0;
window.__inkLastGuess="";
window.__inkShapeOverride="";
window.__inkTopCandidates=[];
window.__inkAssistEnabled=false;
window.__inkGhostPoints=0;
function display(text,muted=false){guess.textContent=text;guess.dataset.muted=muted?"true":"false"}
function chooseTool(next){
 if(next!=="pen"&&next!=="eraser")return;
 tool=next;canvas.dataset.tool=next;
 if(tool!=="pen"){++glyphEpoch;clearGhost()}
 queueGhost();
 for(const name of ["pen","eraser"]){
  document.getElementById(name).setAttribute("aria-pressed",String(name===next));
 }
}
document.getElementById("pen").addEventListener("click",()=>chooseTool("pen"));
document.getElementById("eraser").addEventListener("click",()=>chooseTool("eraser"));

// INK AI: whole-character correction with CNN recognition and English word context.
// The preview proposes an entire character. Acceptance replaces that ink;
// it never attempts to extrapolate a partial neural stroke.
const dictionarySource=document.getElementById("englishWords");
const englishRank=new Map();
const englishPrefixes=new Set();
if(dictionarySource){
 const entries=dictionarySource.textContent.trim().split(/\s+/);
 for(let i=0;i<entries.length;i++){
  const w=entries[i].toLowerCase();
  if(!/^[a-z]+$/.test(w)||englishRank.has(w))continue;
  englishRank.set(w,i+1);
  for(let j=2;j<Math.min(w.length,24);j++)englishPrefixes.add(w.slice(0,j));
 }
}
window.__inkDictionaryWords=englishRank.size;
window.__inkDictionaryReady=englishRank.size>8500;
window.__inkAssistModel="cnn-word-autocorrect";
window.__inkAssistLabel="";
window.__inkGhostSource="none";
window.__inkGhostPoints=0;
window.__inkGhostSegments=0;
window.__inkSuggestionChoices=[];
window.__inkAcceptedCorrections=0;
window.__inkCorrectionConfidence=0;
window.__inkContextWord="";
window.__inkAutocorrectReady=true;
const correctionStatus=document.getElementById("correctionStatus");
const acceptCorrectionButton=document.getElementById("acceptCorrection");
let glyphEpoch=0,correctionChoices=[],correctionIndex=0,correctionBox=null;
let suggestionVersion=0;

function clearGhost(){
 ghostCandidate=null;correctionChoices=[];correctionIndex=0;correctionBox=null;
 ++suggestionVersion;
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 window.__inkGhostPoints=0;window.__inkGhostSegments=0;
 window.__inkAssistLabel="";window.__inkGhostSource="none";
 window.__inkSuggestionChoices=[];window.__inkCorrectionConfidence=0;
 acceptCorrectionButton.disabled=true;
 correctionStatus.textContent=assistEnabled?
  "Write a letter to see a complete correction. Tab changes the suggestion.":
  "Turn on Assist to correct whole letters. G accepts a suggestion.";
}
function queueGhost(){
 // Predictions use the whole written character after pointerup; never infer
 // while an incomplete stroke is still moving, or resurrect stale previews.
 if(pointer!==null&&ghostCandidate)clearGhost();
}
function updateAssist(){
 assistEnabled=!assistEnabled;
 window.__inkAssistEnabled=assistEnabled;
 assistButton.setAttribute("aria-pressed",String(assistEnabled));
 assistButton.classList.toggle("assist-on",assistEnabled);
 ++glyphEpoch;clearGhost();
 if(assistEnabled&&loaded)schedule(60);
}
assistButton.addEventListener("click",updateAssist);

function rankCorrectionCandidates(options,prefix="",suffix="",preferred="",
                                  dictionary=englishRank,prefixes=englishPrefixes){
 const sorted=(options||[]).filter(x=>x&&typeof x.char==="string"&&
   [...x.char].length===1&&Number.isFinite(x.confidence)&&x.confidence>0);
 if(!sorted.length)return [];
 const best=sorted[0],baseP=best.confidence;
 const available=new Map();
 for(const o of sorted){
  const ch=o.char;
  if(available.has(ch)||o.confidence<baseP*.09)continue;
  // Strong visual evidence should not be overturned by a word list.
  if(baseP>=.87&&ch!==best.char)continue;
  let score=Math.log(Math.max(o.confidence,1e-6));
  const contextWord=(prefix+ch+suffix).toLowerCase();
  if(/^[a-z]$/i.test(best.char)&&/^[a-z]+$/.test(contextWord)&&contextWord.length>=3&&
     (prefix.length+suffix.length)>=2){
   const rank=dictionary.get(contextWord);
   if(rank!==undefined){
    // Exact common word: gentle prior, less than strong CNN evidence.
    score+=1.05+.30*Math.max(0,Math.log(10001/rank)/Math.log(10001));
   }else if(!suffix&&prefixes.has(contextWord)){
    score+=.24;
   }
  }
  if(ch===preferred)score+=.08;
  available.set(ch,{label:ch,score,confidence:o.confidence,
     contextWord:contextWord,wordMatch:dictionary.has(contextWord)});
 }
 return [...available.values()].sort((a,b)=>b.score-a.score)
   .slice(0,4);
}
function correctedContext(regions,predictions,index){
 let prefix="",suffix="",j=index-1;
 const r=regions[index];
 while(j>=0&&regions[j].line===r.line&&!regions[j+1].space){
  const ch=predictions[j]?.top?.[0]?.char||"";
  if(!/^[a-z]$/i.test(ch))break;
  prefix=ch+prefix;j--;
 }
 j=index+1;
 while(j<regions.length&&regions[j].line===r.line&&!regions[j].space){
  const ch=predictions[j]?.top?.[0]?.char||"";
  if(!/^[a-z]$/i.test(ch))break;
  suffix+=ch;j++;
 }
 return {prefix,suffix};
}
function drawCorrectionGlyph(context,char,box,preview){
 const [x0,y0,x1,y1]=box,w=x1-x0+1,h=y1-y0+1;
 const cx=(x0+x1)/2,cy=(y0+y1)/2;
 context.save();
 context.fillStyle=preview?"rgba(255,255,255,.93)":"#fff";
 context.fillRect(x0-4,y0-4,w+8,h+8);
 context.fillStyle=preview?"rgba(28,89,205,.77)":"#111";
 const fontSize=Math.max(25,Math.min(220,h*1.27));
 context.font="600 "+fontSize+"px Arial, Helvetica, sans-serif";
 context.textBaseline="middle";context.textAlign="center";
 // Fit a full character inside the selected handwritten region.
 const width=context.measureText(char).width;
 if(width>w+8){
  context.font="600 "+Math.max(17,fontSize*(w+8)/width)+"px Arial, Helvetica, sans-serif";
 }
 context.fillText(char,cx,cy+Math.min(6,h*.035),Math.max(w+8,12));
 context.restore();
}
function renderGhost(){
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 window.__inkGhostPoints=0;window.__inkGhostSegments=0;
 if(!assistEnabled||tool!=="pen"||!ghostCandidate)return;
 drawCorrectionGlyph(ghostCtx,ghostCandidate.label,ghostCandidate.box,true);
 window.__inkGhostPoints=1;
 window.__inkGhostSegments=1;
 window.__inkGhostSource="complete-character-correction";
 window.__inkAssistLabel=ghostCandidate.label;
 window.__inkCorrectionConfidence=ghostCandidate.confidence;
}
function setGhostChoice(index){
 if(!assistEnabled||!correctionChoices.length||!correctionBox)return;
 correctionIndex=(index+correctionChoices.length)%correctionChoices.length;
 const option=correctionChoices[correctionIndex];
 ghostCandidate={...option,box:correctionBox.slice()};
 renderGhost();
 correctionStatus.textContent="Suggested: "+option.label+
  " · "+Math.round(option.confidence*100)+"% recognition confidence"+
  (option.wordMatch&&option.contextWord.length>=3?
    " · English word: "+option.contextWord:"")+
  " · Tab alternatives · G to accept";
 acceptCorrectionButton.disabled=false;
}
function offerCorrection(regions,predictions,recognized){
 if(!assistEnabled||pointer!==null||tool!=="pen"){clearGhost();return}
 if(!regions?.length||!predictions?.length){clearGhost();return}
 // Do not offer to replace the just-accepted clean correction again.
 if(strokes.at(-1)?.type==="corrected-character"){clearGhost();return}
 const latest=[...strokes].reverse().find(s=>s.tool==="pen"&&
   s.type!=="corrected-character"&&s.points?.length);
 let index=regions.length-1;
 if(latest){
  const p=latest.points.at(-1);
  const distance=(r)=>{
   const [x0,y0,x1,y1]=r.box;
   return (Math.max(0,x0-p[0],p[0]-x1)**2)+
     (Math.max(0,y0-p[1],p[1]-y1)**2);
  };
  for(let i=0;i<regions.length;i++)
   if(distance(regions[i])<distance(regions[index]))index=i;
 }
 const r=regions[index],top=predictions[index]?.top||[];
 if(!top.length){clearGhost();return}
 const context=correctedContext(regions,predictions,index);
 const preferred=regions.length===1&&recognized.length===1?
   recognized:top[0].char;
 const ranked=rankCorrectionCandidates(
   top,context.prefix,context.suffix,preferred);
 if(!ranked.length){clearGhost();return}
 correctionBox=r.box.slice();
 correctionChoices=ranked;
 window.__inkSuggestionChoices=ranked.map(x=>x.label);
 window.__inkContextWord=context.prefix+"["+ranked[0].label+"]"+context.suffix;
 setGhostChoice(0);
}
function acceptGhost(){
 if(!assistEnabled||tool!=="pen"||pointer!==null||!ghostCandidate)return;
 const candidate=ghostCandidate;
 // A single undoable correction record redraws the selected area cleanly.
 // Surrounding letters and all original strokes remain recoverable by Undo.
 strokes.push({tool:"pen",type:"corrected-character",
  char:candidate.label,box:candidate.box.slice(),
  points:[[(candidate.box[0]+candidate.box[2])/2,
           (candidate.box[1]+candidate.box[3])/2]]});
 window.__inkAcceptedCorrections++;
 clearGhost();paint();schedule(65);
}
acceptCorrectionButton.addEventListener("click",acceptGhost);
window.addEventListener("keydown",e=>{
 if(e.key==="Tab"&&assistEnabled&&correctionChoices.length>1){
  e.preventDefault();setGhostChoice(correctionIndex+1);return;
 }
 if((e.key.toLowerCase()==="g"||e.key==="Enter")&&!e.ctrlKey&&
    !e.altKey&&!e.metaKey&&!e.repeat&&
    !(e.target instanceof HTMLInputElement)&&
    !(e.target instanceof HTMLTextAreaElement))acceptGhost();
});

function paint(){
 ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.lineJoin="round";ctx.lineCap="round";
 for(const stroke of (current?[...strokes,current]:strokes)){
  const points=stroke.points;
  if(!points?.length)continue;
  ctx.strokeStyle=stroke.tool==="eraser"?"#fff":"#111";
  ctx.lineWidth=stroke.tool==="eraser"?46:(stroke.width||12);
  if(stroke.type==="corrected-character"&&stroke.box){
   drawCorrectionGlyph(ctx,stroke.char,stroke.box,false);
   continue;
  }
  if(stroke.type==="vector-completion"&&points.length>=2){
   smoothStroke(ctx,points);
  }else{
   ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
   if(points.length===1)ctx.lineTo(points[0][0]+.01,points[0][1]+.01);
   for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
   ctx.stroke();
  }
 }
 queueGhost();
}
paint();
function pos(e){
 const box=canvas.getBoundingClientRect();
 return [Math.max(0,Math.min(canvas.width,(e.clientX-box.left)*canvas.width/box.width)),
         Math.max(0,Math.min(canvas.height,(e.clientY-box.top)*canvas.height/box.height))];
}
function reset(){
 ++glyphEpoch;strokes=[];current=null;pointer=null;clearGhost();paint();++readVersion;
 clearTimeout(readTimer);display(loaded?"Draw something":"Loading AI…",true);
}
canvas.addEventListener("pointerdown",e=>{

   self.postMessage({id,result:{classes:labels.length}});
  }else if(cmd==="read"){
   self.postMessage({id,result:{predictions:e.data.images.map(predict)}});
  }else throw Error("Unsupported command");
 }catch(error){self.postMessage({id,error:String(error?.message||error)})}
};
`;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 worker=new Worker(url);
 URL.revokeObjectURL(url);
 worker.onmessage=e=>{
  const {id,result,error}=e.data;
  const pending=requests.get(id);if(!pending)return;
  requests.delete(id);
  if(error)pending.reject(Error(error));else pending.resolve(result);
 };
 worker.onerror=()=>{loaded=false;window.__inkReady=false;display("AI could not start",true)};
}
async function load(){
 display("Loading AI…",true);
 try{
  let model=null,version=1;
  const candidates=[
   {version:3,relative:"models/ink-cnn-v3.json",remote:RECOGNITION_V3_URL,
       parent:"models/ink-cnn-v2.json"},
   {version:2,relative:"models/ink-cnn-v2.json",remote:RECOGNITION_V2_URL,
       parent:"models/ink-cnn-v1.json"}
  ];
  // The V3 CNN is bundled so this HTML works with no network connection.
  const embedded=document.getElementById("recognitionModelV3");
  if(embedded){
   try{
    const saved=JSON.parse(embedded.textContent);
    if(saved.format==="ink-cnn-int8-v1"&&saved.layers?.length===5&&
       saved.labels?.length===102&&
       saved.training?.finetuned_from==="models/ink-cnn-v2.json"){
      model=saved;version=3;
    }
   }catch(_){/* Older file may lack the embedded model. */}
  }
  for(const entry of candidates){
   if(model)break;
   const urls=location.protocol==="file:"?[entry.remote]:
     [entry.relative,entry.remote];
   for(const url of urls){
    try{
     const r=await fetch(url,{cache:"no-store"});
     if(!r.ok)continue;
     const candidate=await r.json();
     if(candidate.format!=="ink-cnn-int8-v1"||candidate.layers?.length!==5)continue;
     if(candidate.training?.finetuned_from!==entry.parent)continue;
     if(candidate.labels?.length!==102||candidate.input?.join(",")!=="1,32,32")continue;
     model=candidate;version=entry.version;break;
    }catch(_){/* Newer checkpoint is optional. Original model remains safe. */}
   }
   if(model)break;
  }
  if(!model){
   const response=await fetch(MODEL_URL,{cache:"no-store"});
   if(!response.ok)throw Error("HTTP "+response.status);
   model=await response.json();
  }
  if(model.format!=="ink-cnn-int8-v1"||model.layers?.length!==5)
    throw Error("Bad model data");
  createWorker();
  await request("init",{model});
  window.__inkRecognitionVersion=version;
  window.__inkRecognitionAccuracy=model.training?.emnist_test_accuracy||0;
  window.__inkRecognitionPenAccuracy=model.training?.uji_independent_accuracy||null;
  loaded=true;window.__inkReady=true;
  display("Draw something",true);
  if(strokes.length)schedule(80);
 }catch(error){
  display("AI unavailable — check connection",true);
  setTimeout(()=>{if(!loaded)load()},15000);
 }
}
load();
})();
