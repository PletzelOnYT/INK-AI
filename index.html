<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>INK AI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
main{width:min(96vw,1300px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0}
.tools{display:flex;align-items:center;justify-content:center;gap:3px;align-self:center;padding:5px;background:#1b1b1b;border:1px solid #404040;border-radius:16px;box-shadow:0 6px 20px #0006}
.tool{width:48px;height:46px;display:grid;place-items:center;background:transparent;color:#ccc;border:0;border-radius:12px;cursor:pointer;transition:background .1s,color .1s}
.tool:hover{background:#343434;color:#fff}
.tool[aria-pressed="true"]{background:#fff;color:#0c0c0c}
.tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:focus-visible{outline:2px solid white;outline-offset:2px}
#pad[data-tool="eraser"]{cursor:cell}

/* The prediction layer is never part of the saved/recognized ink. */
.board{position:relative;width:100%;aspect-ratio:1200/550;background:#fff;border-radius:14px;overflow:hidden}
.board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ghost{pointer-events:none;z-index:2}
#pad{z-index:1}
.tool.assist-on{background:#ececec;color:#0b0b0b}
@media(max-width:650px){.board{aspect-ratio:1.14/1;border-radius:9px}}


#pad{background:#fff;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#guess{min-height:95px;padding:18px 20px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;color:#fff;font-size:clamp(24px,3vw,43px);font-weight:570;line-height:1.25;letter-spacing:-.02em}
#guess[data-muted="true"]{color:#8e8e8e;font-size:clamp(15px,2vw,23px);font-weight:400;letter-spacing:0}
@media(max-width:650px){main{padding:10px 0;gap:8px;justify-content:start}#pad{border-radius:0}#guess{min-height:80px}}
</style>
</head>
<body>
<main>
  <div class="tools" role="toolbar" aria-label="Drawing tools">
    <button id="pen" class="tool" type="button" aria-label="Pen" title="Pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4-12 12H4v-4L16 4Z"/><path d="m14 6 4 4"/></svg></button>
    <button id="eraser" class="tool" type="button" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.8 13.3-7.4 7.4H7.1l-3.6-3.6a2 2 0 0 1 0-2.8L14.2 3.6a2 2 0 0 1 2.8 0l3.8 3.8a2 2 0 0 1 0 2.8Z"/><path d="m9.5 8.3 7.2 7.2M13.4 20.7H21"/></svg></button>
    <button id="assist" class="tool" type="button" aria-label="Experimental AI handwriting completion" title="AI completes handwritten letters, numbers and symbols · press G to accept" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17Z"/></svg></button>
  </div>
  <div class="board">
    <canvas id="pad" width="1200" height="550" data-tool="pen" aria-label="Write or draw here"></canvas>
    <canvas id="ghost" width="1200" height="550" aria-hidden="true"></canvas>
  </div>
  <div id="guess" data-muted="true" aria-live="polite">Loading AI…</div>
</main>
<script id="glyphWorkerSource" type="text/plain">
"use strict";
// INK AI neural glyph completion: V2 residual 1.1M parameters, V1 fallback.
let model=null,labels=[],embedding=null,layers=[],version=0;
function unpack(layer){
 const raw=atob(layer.weights),w=new Float32Array(raw.length);
 for(let i=0;i<raw.length;i++){
  const z=raw.charCodeAt(i);
  w[i]=(z>127?z-256:z)*layer.scale;
 }
 return {w,b:Float32Array.from(layer.bias),shape:layer.shape};
}
function dense(input,L,relu){
 const [N,M]=L.shape,result=new Float32Array(N);
 for(let o=0;o<N;o++){
  let sum=L.b[o],start=o*M;
  for(let i=0;i<M;i++)sum+=input[i]*L.w[start+i];
  result[o]=relu?Math.max(0,sum):sum;
 }
 return result;
}
function residual(input,L){
 const next=dense(input,L,false),result=new Float32Array(next.length);
 for(let i=0;i<next.length;i++)result[i]=Math.max(0,next[i]+input[i]);
 return result;
}
function reconstruct(partial,label){
 const idx=labels.indexOf(label);
 if(idx<0)throw Error("Unsupported character: "+label);
 const input=new Float32Array(1024+model.dimensions.class_embedding);
 input.set(partial);
 input.set(embedding.subarray(idx*model.dimensions.class_embedding,(idx+1)*model.dimensions.class_embedding),1024);
 let h=dense(input,layers[0],true);
 if(version===2){
  h=residual(h,layers[1]);
  h=residual(h,layers[2]);
 }else{
  h=dense(h,layers[1],true);
 }
 const full=dense(h,layers[version===2?3:2],false);
 const output=new Uint8Array(1024);
 for(let i=0;i<1024;i++){
  const val=1/(1+Math.exp(-Math.max(-20,Math.min(20,full[i]))));
  output[i]=Math.max(0,Math.min(255,Math.round(val*255)));
 }
 return output;
}
// Reference bank: authentic individual handwritten examples, not averaged
// glyph rasters. Neural completion picks plausible characters; matching the
// user's existing ink to actual human samples stabilizes predicted geometry.
let referenceStrings=Object.create(null);
const decodedReferences=new Map();
function prototypeSet(label){
 if(decodedReferences.has(label))return decodedReferences.get(label);
 const strings=referenceStrings[label]||[];
 const shapes=[];
 for(const encoded of strings){
  const bytes=atob(encoded),bitmap=new Uint8Array(1024);
  for(let i=0;i<1024;i++)
   bitmap[i]=(bytes.charCodeAt(i>>3)>>(7-(i&7)))&1;
  shapes.push(bitmap);
 }
 decodedReferences.set(label,shapes);
 return shapes;
}
function nearestHandwriting(partial,label,neural){
 const shapes=prototypeSet(label);
 if(!shapes.length)return null;
 const observed=[];
 for(let i=0;i<1024;i++)
  if(partial[i]>.3)observed.push({i,x:i&31,y:i>>5,weight:partial[i]});
 if(observed.length<6)return null;
 const total=observed.reduce((a,b)=>a+b.weight,0);
 let best=null,score=-Infinity;
 // Align each human-written prototype to the incomplete stroke, allowing
 // a small translation for different handwriting placement.
 for(const shape of shapes){
  for(const dy of [-3,-1,1,3,0])for(const dx of [-3,-1,1,3,0]){
   let hit=0;
   for(const point of observed){
    const x=point.x-dx,y=point.y-dy;
    if(x>=0&&x<32&&y>=0&&y<32&&shape[y*32+x])hit+=point.weight;
   }
   const match=hit/total;
   if(match<score-.04)continue;
   let outside=0,referenceCount=0,neuralAgreement=0;
   for(let y=1;y<31;y++)for(let x=1;x<31;x++){
    const tx=x-dx,ty=y-dy;
    if(tx<0||tx>31||ty<0||ty>31||!shape[ty*32+tx])continue;
    const i=y*32+x;referenceCount++;
    if(partial[i]<.27)outside++;
    neuralAgreement+=neural[i]/255;
   }
   const novelty=Math.min(1,outside/25);
   const overlap=referenceCount?neuralAgreement/referenceCount:0;
   const quality=match+.14*overlap+.075*novelty-
        (referenceCount>240?.13:0);
   if(quality>score){score=quality;best={shape,dx,dy,match,novelty,quality}}
  }
 }
 if(!best||best.match<.40)return null;
 const output=new Uint8Array(1024);
 for(let y=0;y<32;y++)for(let x=0;x<32;x++){
  const sx=x-best.dx,sy=y-best.dy;
  const real=sx>=0&&sx<32&&sy>=0&&sy<32?
    best.shape[sy*32+sx]:0;
  // Preserve actual human topology. A small trained-model contribution
  // smooths isolated source defects; not a fuzzy probabilistic image paste.
  output[y*32+x]=Math.round(real?238:Math.min(35,neural[y*32+x]*.12));
 }
 return {prediction:output,coverage:best.match,novelty:best.novelty,
    quality:best.quality,realExample:true};
}
function pickCompletion(partial,options){
 const given=Array.isArray(options)&&options.length?options.slice(0,5):
   [{char:"?",confidence:1}];
 const incoming=new Map();
 for(const c of given)if(labels.includes(c.char))
  incoming.set(c.char,Math.max(.001,Number(c.confidence)||.001));
 // Incomplete straight strokes often look like finished I/l/1/| to the OCR.
 // They could instead be the beginning of P, B, H, 4, +, etc. Do not rule
 // those out just because the *full-character* classifier says "1".
 const ambiguous=new Set(["I","l","1","|","i","L","t","T","!","/","-"]);
 if(given.slice(0,3).some(c=>ambiguous.has(c.char))){
  for(const letter of ["B","P","R","F","H","E","D","T","L","K","4","+","7","J"])
   if(labels.includes(letter)&&!incoming.has(letter))incoming.set(letter,.035);
 }
 const hypotheses=[];
 for(const [char,confidence] of incoming){
  const learned=reconstruct(partial,char);
  const grounded=nearestHandwriting(partial,char,learned);
  const pred=grounded?.prediction||learned;
  let agrees=0,visible=0,newInk=0,ink=0;
  for(let i=0;i<1024;i++){
   if(partial[i]>.30){agrees+=partial[i]*pred[i]/255;visible+=partial[i]}
   if(partial[i]<.22&&pred[i]>145)newInk++;
   if(pred[i]>145)ink++;
  }
  const support=agrees/Math.max(1,visible);
  const novelty=Math.min(1,newInk/24);
  const neuralBonus=grounded?.realExample?grounded.coverage*.42:0;
  let score=1.25*support+.23*Math.log(confidence+.02)
    +.15*novelty+neuralBonus;
  if(newInk<5)score-=.4; // A non-completion is not a useful suggestion.
  if(ink>300)score-=.3;  // Avoid overfilled character hallucinations.
  hypotheses.push({label:char,prediction:pred,score,
    source:grounded?"real-handwriting":"trained-generator",
    coverage:grounded?.coverage||support});
 }
 hypotheses.sort((a,b)=>b.score-a.score);
 const good=hypotheses.slice(0,4);
 if(!good.length)throw Error("No supported character completion");
 return {primary:good[0],alternatives:good};
}
self.onmessage=e=>{
 const {cmd}=e.data;
 try{
  if(cmd==="init"){
   const m=e.data.model;
   if(m.format!=="ink-glyph-completion-residual-v2"&&
      m.format!=="ink-glyph-completion-mlp-v1")throw Error("Wrong handwriting model format");
   version=m.format==="ink-glyph-completion-residual-v2"?2:1;
   if(m.layers?.length!==(version===2?4:3)||m.dimensions?.input!==1024)
      throw Error("Invalid neural architecture");
   if(version===2 && (m.parameter_count<1000000||m.parameter_count>=2000000))
      throw Error("Invalid V2 parameter count");
   model=m;labels=m.labels;
   embedding=Float32Array.from(m.embedding.flat());
   layers=m.layers.map(unpack);
   if(layers[0].shape[1]!==1024+m.dimensions.class_embedding||
      layers[version===2?3:2].shape[0]!==1024)throw Error("Invalid weights");
   self.postMessage({type:"ready",model:"handwriting",version,
      parameters:m.parameter_count||0,classes:labels.length});
  }else if(cmd==="references"){
   if(e.data.references?.format!=="ink-human-glyph-examples-v1")
      throw Error("Invalid human handwriting references");
   referenceStrings=e.data.references.per_class;
   decodedReferences.clear();
   self.postMessage({type:"references-ready",count:e.data.references.total_examples});
  }else if(cmd==="complete"){
   if(!model)throw Error("Handwriting model not initialized");
   const {serial,epoch,partial,label,options}=e.data;
   const selected=options?pickCompletion(partial,options):
      {primary:{label,prediction:reconstruct(partial,label)},
       alternatives:[]};
   const chosen=selected.primary;
   const alt=selected.alternatives?.map(x=>({
     label:x.label,prediction:x.prediction,source:x.source
   }))||[];
   self.postMessage({type:"completion",serial,epoch,
       label:chosen.label,prediction:chosen.prediction,
       alternatives:alt,source:chosen.source});
  }
 }catch(error){
  self.postMessage({type:"error",message:String(error?.message||error)});
 }
};
</script>
<script>
"use strict";
(() => {
const MODEL_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v1.json";
const RECOGNITION_V2_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v2.json";
const canvas=document.getElementById("pad"), ctx=canvas.getContext("2d",{willReadFrequently:true}), guess=document.getElementById("guess");
const ghostCanvas=document.getElementById("ghost"),ghostCtx=ghostCanvas.getContext("2d");
const assistButton=document.getElementById("assist");
let strokes=[],current=null,pointer=null,worker=null,loaded=false,requestId=0,readVersion=0,readTimer=0,tool="pen";
let assistEnabled=false,ghostCandidate=null;
const requests=new Map();
window.__inkReady=false;
window.__inkEngine="cnn";
window.__inkRecognitionVersion=0;
window.__inkRecognitionAccuracy=0;
window.__inkDetectedRegions=0;
window.__inkLastGuess="";
window.__inkShapeOverride="";
window.__inkTopCandidates=[];
window.__inkAssistEnabled=false;
window.__inkGhostPoints=0;
function display(text,muted=false){guess.textContent=text;guess.dataset.muted=muted?"true":"false"}
function chooseTool(next){
 if(next!=="pen"&&next!=="eraser")return;
 tool=next;canvas.dataset.tool=next;
 if(tool!=="pen"){++glyphEpoch;clearGhost()}
 queueGhost();
 for(const name of ["pen","eraser"]){
  document.getElementById(name).setAttribute("aria-pressed",String(name===next));
 }
}
document.getElementById("pen").addEventListener("click",()=>chooseTool("pen"));
document.getElementById("eraser").addEventListener("click",()=>chooseTool("eraser"));

// Experimental Assist uses independently trained generative weights. NO
// curve extrapolation, font completion, heuristics, or other providers.
// Only the independent LETTER/DIGIT/SYMBOL completion model is allowed here.
// No Quick Draw sketches, no movement extrapolation, no third-party inference.
const GLYPH_V2_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-glyph-completion-v2.json";
const GLYPH_V1_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-glyph-completion-v1.json";
const GLYPH_REFERENCES_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-human-glyph-references.json";
let glyphWorker=null,glyphReady=false,glyphLoading=false,glyphBusy=false;
let glyphTimer=0,glyphRetry=0,glyphSerial=0,glyphEpoch=0,glyphDirty=false;
window.__inkGlyphReady=false;
window.__inkAssistModel="handwriting-only";
window.__inkGlyphVersion=0;
window.__inkGlyphParameters=0;
window.__inkLastGlyphError="";
window.__inkHumanExamples=0;
window.__inkAssistLabel="";
window.__inkGhostSource="none";
window.__inkGhostSegments=0;
window.__inkGhostStrokeWidth=0;
window.__inkAcceptedVectorCount=0;
window.__inkSuggestionChoices=[];
let humanReferences=null,humanReferencesLoading=false,ghostOptions=[],ghostChoice=0;
async function loadHumanReferences(){
 if(!assistEnabled||!glyphWorker||humanReferencesLoading)return;
 humanReferencesLoading=true;
 try{
  if(!humanReferences){
   const sources=location.protocol==="file:"?[GLYPH_REFERENCES_URL]:
      ["models/ink-human-glyph-references.json",GLYPH_REFERENCES_URL];
   let error=null;
   for(const source of sources){
    try{
     const response=await fetch(source,{cache:"default"});
     if(!response.ok)throw Error("HTTP "+response.status);
     humanReferences=await response.json();
     if(humanReferences.format!=="ink-human-glyph-examples-v1")
       throw Error("Wrong handwriting examples format");
     break;
    }catch(e){error=e;humanReferences=null}
   }
   if(!humanReferences)throw error||Error("Human handwriting examples unavailable");
  }
  glyphWorker.postMessage({cmd:"references",references:humanReferences});
 }catch(_){
  // Optional examples; do not disable trained network if no bank is published.
 }finally{humanReferencesLoading=false}
}
function clearGhost(){
 ghostCandidate=null;ghostOptions=[];ghostChoice=0;
 window.__inkSuggestionChoices=[];
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 window.__inkGhostPoints=0;
 window.__inkGhostSegments=0;
 window.__inkAssistLabel="";
 window.__inkGhostSource="none";
}
function queueGhost(){
 if(!assistEnabled||tool!=="pen"){clearGhost();return}
 if(!glyphReady){clearGhost();return}
 if(glyphBusy){glyphDirty=true;return}
 if(glyphTimer)return;
 glyphTimer=setTimeout(()=>{
  glyphTimer=0;generateGlyph();
 },115);
}
function updateAssist(){
 assistEnabled=!assistEnabled;
 window.__inkAssistEnabled=assistEnabled;
 assistButton.setAttribute("aria-pressed",String(assistEnabled));
 assistButton.classList.toggle("assist-on",assistEnabled);
 ++glyphEpoch;
 if(!assistEnabled){
  clearTimeout(glyphTimer);glyphTimer=0;glyphDirty=false;clearGhost();
 }else{
  if(!glyphReady||window.__inkGlyphVersion<2)loadGlyphModel();
  queueGhost();
 }
}
assistButton.addEventListener("click",updateAssist);

function bounding(stroke){
 let left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;
 for(const p of stroke.points){
  left=Math.min(left,p[0]);right=Math.max(right,p[0]);
  top=Math.min(top,p[1]);bottom=Math.max(bottom,p[1]);
 }
 return {left,right,top,bottom};
}
function completionInput(){
 const recent=(current?[...strokes,current]:strokes)
  .filter(s=>s.tool==="pen"&&s.points?.length>=2);
 if(!recent.length)return null;
 const chosen=[recent[recent.length-1]];
 let bounds=bounding(chosen[0]);
 // Group pen strokes that likely belong to this character (e.g. H, i, %).
 for(let i=recent.length-2;i>=Math.max(0,recent.length-7);i--){
  const item=recent[i],b=bounding(item);
  const dx=Math.max(0,b.left-bounds.right,bounds.left-b.right);
  const dy=Math.max(0,b.top-bounds.bottom,bounds.top-b.bottom);
  if(dx>33||dy>50)break;
  if(Math.max(bounds.right,b.right)-Math.min(bounds.left,b.left)>240)break;
  chosen.unshift(item);
  bounds={left:Math.min(bounds.left,b.left),right:Math.max(bounds.right,b.right),
   top:Math.min(bounds.top,b.top),bottom:Math.max(bounds.bottom,b.bottom)};
 }
 const width=bounds.right-bounds.left,height=bounds.bottom-bounds.top;
 const size=Math.min(270,Math.max(100,1.43*Math.max(width,height)));
 const frame={x:bounds.left-size*.17,y:bounds.top-size*.17,size};
 // Stable approximately 32x32 handwriting frame, aligned with the centered
 // partial-letter masks used when training. It can include new empty space
 // into which the neural model predicts the missing character strokes.
 const c=document.createElement("canvas");c.width=c.height=32;
 const t=c.getContext("2d",{willReadFrequently:true});
 t.fillStyle="#fff";t.fillRect(0,0,32,32);
 t.imageSmoothingEnabled=true;t.imageSmoothingQuality="high";
 const scale=32/size;
 t.drawImage(canvas,-frame.x*scale,-frame.y*scale,canvas.width*scale,canvas.height*scale);
 const pixels=t.getImageData(0,0,32,32).data;
 const partial=new Array(1024);
 let amount=0;
 for(let i=0;i<1024;i++){
  partial[i]=1-(pixels[i*4]+pixels[i*4+1]+pixels[i*4+2])/765;
  if(partial[i]>.22)amount++;
 }
 if(amount<4)return null;
 return {frame,partial};
}
function createGlyphWorker(){
 if(glyphWorker)glyphWorker.terminate();
 const source=document.getElementById("glyphWorkerSource").textContent;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 glyphWorker=new Worker(url);URL.revokeObjectURL(url);
 glyphWorker.onmessage=e=>{
  const m=e.data;
  if(m.type==="ready"){
   glyphReady=true;glyphBusy=false;window.__inkGlyphReady=true;
   window.__inkGlyphVersion=m.version;window.__inkGlyphParameters=m.parameters;
   assistButton.title=m.version===2?
    "INK AI V2 · real handwriting-assisted auto-completion · Tab alternatives · G accept":
    "INK AI V1 · handwriting completion · G accept";
   loadHumanReferences();
   queueGhost();
  }else if(m.type==="references-ready"){
   window.__inkHumanExamples=m.count||0;
   if(assistEnabled&&tool==="pen")queueGhost();
  }else if(m.type==="completion"){
   glyphBusy=false;
   if(assistEnabled&&tool==="pen"&&m.epoch===glyphEpoch&&
      m.serial===glyphSerial&&ghostPending?.serial===m.serial){
    ghostOptions=(m.alternatives?.length?m.alternatives:
      [{label:m.label,prediction:m.prediction,source:m.source}]);
    window.__inkSuggestionChoices=ghostOptions.map(o=>o.label);
    ghostChoice=0;
    setGhostChoice(0);
   }
   const dirty=glyphDirty;glyphDirty=false;
   if(dirty||pointer!==null)queueGhost();
  }else if(m.type==="error"){
   glyphBusy=false;window.__inkLastGlyphError=m.message||"Completion failed";
   assistButton.title=window.__inkLastGlyphError;
  }
 };
 glyphWorker.onerror=()=>{
  glyphReady=false;glyphBusy=false;window.__inkGlyphReady=false;
  window.__inkLastGlyphError="Handwriting worker failed";
 };
}
let ghostPending=null;
async function loadGlyphModel(){
 if(glyphLoading)return;
 // If using V1, a later tap can upgrade to V2 without reinstalling HTML.
 if(glyphReady&&window.__inkGlyphVersion===2)return;
 glyphLoading=true;
 assistButton.title="Loading trained neural handwriting completion…";
 try{
  let model=null,v2Error=null;
  const sources=location.protocol==="file:"?[GLYPH_V2_URL]:
     ["models/ink-glyph-completion-v2.json",GLYPH_V2_URL];
  for(const source of sources){
   try{
    const response=await fetch(source,{cache:"no-store"});
    if(!response.ok)throw Error("V2 not published: HTTP "+response.status);
    model=await response.json();
    if(model.format!=="ink-glyph-completion-residual-v2")
      throw Error("Incorrect V2 data");
    break;
   }catch(e){v2Error=e;model=null}
  }
  if(!model){
   if(glyphReady)return; // V1 is already running; never disrupt the board.
   const response=await fetch(GLYPH_V1_URL,{cache:"default"});
   if(!response.ok)throw Error("Neither completion model available; V2: "+String(v2Error));
   model=await response.json();
   if(model.format!=="ink-glyph-completion-mlp-v1")throw Error("Incorrect V1 data");
  }
  glyphReady=false;
  createGlyphWorker();
  glyphWorker.postMessage({cmd:"init",model});
  window.__inkLastGlyphError="";
 }catch(err){
  window.__inkLastGlyphError=String(err.message||err);
  assistButton.title="Neural handwriting completion unavailable; retrying";
  if(assistEnabled&&!glyphReady){
   clearTimeout(glyphRetry);

    const dy=ordered[j][1]-ordered[j-1][1];
    if(dx<-Math.max(8,w*.028))backwards++;
    // Actual caret slopes run consistently up into apex, down afterward.
    wrongVertical+=j<=i?Math.max(0,dy):Math.max(0,-dy);
   }
   return backwards<Math.max(3,ordered.length*.14)&&
      wrongVertical<h*.22;
  };
  if(looksLikeSinglePeak(peak))return "^";
  const a=ordered[0],p=ordered[valleyIndex],b=ordered[ordered.length-1];
  if(valleyIndex>1&&valleyIndex<ordered.length-2&&
      p[1]-Math.max(a[1],b[1])>h*.48&&
      Math.abs(a[1]-b[1])<h*.4&&
      p[0]-a[0]>w*.20&&b[0]-p[0]>w*.20)return "V";
 }
 return null;
}
async function recognize(version){
 if(!loaded||version!==readVersion)return;
 const {regions,pixels}=segment();
 window.__inkDetectedRegions=regions.length;
 if(!regions.length){display("Draw something",true);return}
 const simple=shapeFromStroke(regions);
 window.__inkShapeOverride=simple||"";
 if(simple!==null){display(simple);window.__inkLastGuess=simple;return}
 try{
  const images=regions.map(r=>normalize(r.box,pixels));
  const {predictions}=await request("read",{images});
  if(version!==readVersion)return;
  let result="",lastLine=regions[0].line;
  function candidate(i,char){return predictions[i]?.top?.find(p=>p.char===char)}
  function neighboringType(i,step){
   let j=i+step;
   if(j<0||j>=regions.length)return "";
   if(regions[j].line!==regions[i].line)return "";
   if(step<0 && regions[i].space)return "";
   if(step>0 && regions[j].space)return "";
   const ch=predictions[j]?.top?.[0]?.char||"";
   if(/[0-9]/.test(ch))return "number";
   if(/[a-z]/.test(ch))return "lower";
   if(/[A-Z]/.test(ch))return "upper";
   return "";
  }
  function wordStyle(i){
   let start=i,end=i;
   while(start>0&&regions[start].line===regions[start-1].line&&!regions[start].space)start--;
   while(end+1<regions.length&&regions[end+1].line===regions[i].line&&!regions[end+1].space)end++;
   let lower=0,upper=0;
   for(let n=start;n<=end;n++){
    const ch=predictions[n]?.top?.[0]?.char||"";
    // Same-looking handwritten cases are not evidence of case:
    // EMNIST often cannot distinguish C/c, O/o, S/s, M/m etc.
    if(/[cosmuvwxzCOSMUVWXZ]/.test(ch))continue;
    if(/[a-z]/.test(ch))lower++;
    if(/[A-Z]/.test(ch))upper++;
   }
   return lower>=2&&lower>upper*2?"lower":
      upper>=2&&upper>lower*2?"upper":"neutral";
  }
  window.__inkTopCandidates=predictions.map(p=>p.top.slice(0,3));
  for(let i=0;i<regions.length;i++){
   if(i&&regions[i].line!==lastLine){result+="\n";lastLine=regions[i].line}
   else if(i&&regions[i].space)result+=" ";
   const options=predictions[i].top;
   let ch=options[0].char;
   const before=neighboringType(i,-1),after=neighboringType(i,1);
   const ambiguous=["1","I","l","|","i"];
   if(ambiguous.includes(ch)){
    if((before==="number"||after==="number")&&candidate(i,"1"))ch="1";
    else if(before==="lower"||after==="lower"){
     if(candidate(i,"l"))ch="l";
     else if(candidate(i,"i")&&ch!=="I")ch="i";
    }else if((before==="upper"||after==="upper")&&candidate(i,"I"))ch="I";
   }
   // Contextual case disambiguation for shapes that even real EMNIST writers
   // draw nearly identically in uppercase and lowercase. Never invent extra
   // characters or split a continuous stroke to apply this correction.
   const style=wordStyle(i);
   const visuallyAmbiguous="COSMUVWXZ";
   if(style==="lower"&&visuallyAmbiguous.includes(ch)){
    const lowercase=ch.toLowerCase();
    const alt=candidate(i,lowercase);
    if(alt||options[0].confidence<.92)ch=lowercase;
   }else if(style==="upper"&&visuallyAmbiguous.toLowerCase().includes(ch)){
    const uppercase=ch.toUpperCase();
    const alt=candidate(i,uppercase);
    if(alt||options[0].confidence<.92)ch=uppercase;
   }
   // A very uncertain output is better presented as unknown than as a
   // made-up confident character. This does not affect actual model logits.
   if(options[0].confidence<.075&&
      (options[0].confidence-(options[1]?.confidence||0))<.016)ch="?";
   result+=ch;
  }
  display(result);
  window.__inkLastGuess=result;
 }catch(e){if(version===readVersion)display("Recognition unavailable",true)}
}
function createWorker(){
 const source=String.raw`
"use strict";
let labels=[],c1,c2,c3,f1,f2;
function unpack(layer){
 const raw=atob(layer.weights);
 const w=new Float32Array(raw.length),b=new Float32Array(layer.bias);
 for(let i=0;i<raw.length;i++){const value=raw.charCodeAt(i);w[i]=(value>127?value-256:value)*layer.scale}
 return {shape:layer.shape,w,b};
}
function conv(input,L,size){
 const [outChannels,inChannels,kernel]=L.shape,output=new Float32Array(outChannels*size*size),pad=(kernel-1)/2;
 for(let o=0;o<outChannels;o++)for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  let total=L.b[o];
  for(let i=0;i<inChannels;i++)for(let ky=0;ky<kernel;ky++){
   const sy=y+ky-pad;if(sy<0||sy>=size)continue;
   for(let kx=0;kx<kernel;kx++){
    const sx=x+kx-pad;if(sx<0||sx>=size)continue;
    const wi=((o*inChannels+i)*kernel+ky)*kernel+kx;
    total+=input[(i*size+sy)*size+sx]*L.w[wi];
   }
  }
  output[(o*size+y)*size+x]=total;
 }
 return output;
}
function pool(input,channels,size){
 const next=size/2,result=new Float32Array(channels*next*next);
 for(let c=0;c<channels;c++)for(let y=0;y<next;y++)for(let x=0;x<next;x++){
  const i=c*size*size+(y*2)*size+x*2;
  result[(c*next+y)*next+x]=Math.max(0,input[i],input[i+1],input[i+size],input[i+size+1]);
 }
 return result;
}
function dense(input,L,relu){
 const [count,length]=L.shape,result=new Float32Array(count);
 for(let o=0;o<count;o++){
  let value=L.b[o];
  const offset=o*length;
  for(let i=0;i<length;i++)value+=L.w[offset+i]*input[i];
  result[o]=relu?Math.max(0,value):value;
 }
 return result;
}
function predict(image){
 let a=pool(conv(Float32Array.from(image),c1,32),12,32);
 a=pool(conv(a,c2,16),24,16);
 a=pool(conv(a,c3,8),32,8);
 const logits=dense(dense(a,f1,true),f2,false);
 let high=-Infinity;
 for(let i=0;i<logits.length;i++)high=Math.max(high,logits[i]);
 const probabilities=Array.from(logits,v=>Math.exp((v-high)/1.25));
 const sum=probabilities.reduce((a,b)=>a+b,0);
 return {top:probabilities.map((p,i)=>({char:labels[i],confidence:p/sum}))
     .sort((a,b)=>b.confidence-a.confidence).slice(0,5)};
}
self.onmessage=e=>{
 const {id,cmd}=e.data;
 try{
  if(cmd==="init"){
   const m=e.data.model;
   if(m.format!=="ink-cnn-int8-v1"||m.layers?.length!==5)throw Error("Unsupported model");
   labels=m.labels;
   [c1,c2,c3,f1,f2]=m.layers.map(unpack);
   self.postMessage({id,result:{classes:labels.length}});
  }else if(cmd==="read"){
   self.postMessage({id,result:{predictions:e.data.images.map(predict)}});
  }else throw Error("Unsupported command");
 }catch(error){self.postMessage({id,error:String(error?.message||error)})}
};
`;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 worker=new Worker(url);
 URL.revokeObjectURL(url);
 worker.onmessage=e=>{
  const {id,result,error}=e.data;
  const pending=requests.get(id);if(!pending)return;
  requests.delete(id);
  if(error)pending.reject(Error(error));else pending.resolve(result);
 };
 worker.onerror=()=>{loaded=false;window.__inkReady=false;display("AI could not start",true)};
}
async function load(){
 display("Loading AI…",true);
 try{
  let model=null,upgrade=false;
  const sources=location.protocol==="file:"?[RECOGNITION_V2_URL]:
      ["models/ink-cnn-v2.json",RECOGNITION_V2_URL];
  for(const source of sources){
   try{
    const r=await fetch(source,{cache:"no-store"});
    if(!r.ok)continue;
    const candidate=await r.json();
    if(candidate.format!=="ink-cnn-int8-v1"||candidate.layers?.length!==5)continue;
    if(candidate.training?.finetuned_from!=="models/ink-cnn-v1.json")continue;
    model=candidate;upgrade=true;break;
   }catch(_){/* V2 is optional until safe fine-tuning passes */}
  }
  if(!model){
   const response=await fetch(MODEL_URL,{cache:"no-store"});
   if(!response.ok)throw Error("HTTP "+response.status);
   model=await response.json();
  }
  if(model.format!=="ink-cnn-int8-v1"||model.layers?.length!==5)
    throw Error("Bad model data");
  createWorker();
  await request("init",{model});
  window.__inkRecognitionVersion=upgrade?2:1;
  window.__inkRecognitionAccuracy=model.training?.emnist_test_accuracy||0;
  loaded=true;window.__inkReady=true;
  display("Draw something",true);
  if(strokes.length)schedule(80);
 }catch(error){
  display("AI unavailable — check connection",true);
  setTimeout(()=>{if(!loaded)load()},15000);
 }
}
load();
})();
