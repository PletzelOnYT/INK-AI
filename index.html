<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>INK AI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
main{width:min(96vw,1300px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0}
.tools{display:flex;align-items:center;justify-content:center;gap:3px;align-self:center;padding:5px;background:#1b1b1b;border:1px solid #404040;border-radius:16px;box-shadow:0 6px 20px #0006}
.tool{width:48px;height:46px;display:grid;place-items:center;background:transparent;color:#ccc;border:0;border-radius:12px;cursor:pointer;transition:background .1s,color .1s}
.tool:hover{background:#343434;color:#fff}
.tool[aria-pressed="true"]{background:#fff;color:#0c0c0c}
.tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:focus-visible{outline:2px solid white;outline-offset:2px}
#pad[data-tool="eraser"]{cursor:cell}

/* The prediction layer is never part of the saved/recognized ink. */
.board{position:relative;width:100%;aspect-ratio:1200/550;background:#fff;border-radius:14px;overflow:hidden}
.board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ghost{pointer-events:none;z-index:2}
#pad{z-index:1}
.tool.assist-on{background:#ececec;color:#0b0b0b}
@media(max-width:650px){.board{aspect-ratio:1.14/1;border-radius:9px}}


#pad{background:#fff;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#guess{min-height:95px;padding:18px 20px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;color:#fff;font-size:clamp(24px,3vw,43px);font-weight:570;line-height:1.25;letter-spacing:-.02em}
#guess[data-muted="true"]{color:#8e8e8e;font-size:clamp(15px,2vw,23px);font-weight:400;letter-spacing:0}
@media(max-width:650px){main{padding:10px 0;gap:8px;justify-content:start}#pad{border-radius:0}#guess{min-height:80px}}
</style>
</head>
<body>
<main>
  <div class="tools" role="toolbar" aria-label="Drawing tools">
    <button id="pen" class="tool" type="button" aria-label="Pen" title="Pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4-12 12H4v-4L16 4Z"/><path d="m14 6 4 4"/></svg></button>
    <button id="eraser" class="tool" type="button" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.8 13.3-7.4 7.4H7.1l-3.6-3.6a2 2 0 0 1 0-2.8L14.2 3.6a2 2 0 0 1 2.8 0l3.8 3.8a2 2 0 0 1 0 2.8Z"/><path d="m9.5 8.3 7.2 7.2M13.4 20.7H21"/></svg></button>
    <button id="assist" class="tool" type="button" aria-label="Experimental AI drawing assist" title="Experimental Assist · faint stroke suggestions · press G to use a suggestion" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17Z"/></svg></button>
  </div>
  <div class="board">
    <canvas id="pad" width="1200" height="550" data-tool="pen" aria-label="Write or draw here"></canvas>
    <canvas id="ghost" width="1200" height="550" aria-hidden="true"></canvas>
  </div>
  <div id="guess" data-muted="true" aria-live="polite">Loading AI…</div>
</main>
<script id="sketchWorkerSource" type="text/plain">
"use strict";
// Real autoregressive neural inference for a GRU trained on Quick Draw
// pen trajectories. The old geometric/curvature predictor is not used.
let model=null,hiddenSize=0,mixtures=0,scalePx=20;
let ih,hh,bih,bhh,head,bhead;
function decode(layer){
 const str=atob(layer.b64);
 const w=new Float32Array(str.length);
 for(let i=0;i<str.length;i++){
  const c=str.charCodeAt(i);w[i]=(c>127?c-256:c)*layer.scale;
 }
 return {w,shape:layer.shape};
}
function sigmoid(x){return x>=0?1/(1+Math.exp(-x)):Math.exp(x)/(1+Math.exp(x))}
function evaluateStep(input,oldHidden){
 const H=hiddenSize,R=3*H;
 const gi=new Float32Array(R),gh=new Float32Array(R);
 // PyTorch's GRU gate order: reset, update, new (r,z,n).
 for(let r=0;r<R;r++){
  const ix=r*3,hx=r*H;
  gi[r]=bih[r]+ih.w[ix]*input[0]+ih.w[ix+1]*input[1]+ih.w[ix+2]*input[2];
  let v=bhh[r];
  for(let j=0;j<H;j++)v+=hh.w[hx+j]*oldHidden[j];
  gh[r]=v;
 }
 const h=new Float32Array(H);
 for(let j=0;j<H;j++){
  const reset=sigmoid(gi[j]+gh[j]);
  const update=sigmoid(gi[H+j]+gh[H+j]);
  const value=Math.tanh(gi[2*H+j]+reset*gh[2*H+j]);
  h[j]=(1-update)*value+update*oldHidden[j];
 }
 const rows=head.shape[0];
 const logits=new Float32Array(rows);
 for(let i=0;i<rows;i++){
  let v=bhead[i];const off=i*H;
  for(let j=0;j<H;j++)v+=head.w[off+j]*h[j];
  logits[i]=v;
 }
 return {h,logits};
}
function randomStream(seed){
 let z=(seed|0)||0x49a62b11;
 return ()=>{
  z^=z<<13;z^=z>>>17;z^=z<<5;
  return (z>>>0)/4294967296;
 };
}
function normal(rng){
 return Math.sqrt(-2*Math.log(Math.max(1e-9,rng())))
   *Math.cos(2*Math.PI*rng());
}
function chooseMove(output,rng){
 const K=mixtures;
 let high=-Infinity;
 for(let i=0;i<K;i++)high=Math.max(high,output[i]);
 const weights=[],temperature=.88;
 let sum=0;
 for(let i=0;i<K;i++){const p=Math.exp((output[i]-high)/temperature);weights.push(p);sum+=p}
 let sample=rng()*sum,k=K-1;
 for(let i=0;i<K;i++){sample-=weights[i];if(sample<=0){k=i;break}}
 const sx=Math.exp(Math.max(-3,Math.min(1.65,output[3*K+k])));
 const sy=Math.exp(Math.max(-3,Math.min(1.65,output[4*K+k])));
 // Small stochasticity is sampled FROM the learned Gaussian distribution.
 const dx=output[K+k]+normal(rng)*sx*.37;
 const dy=output[2*K+k]+normal(rng)*sy*.37;
 const up=sigmoid(output[5*K])>.54;
 const stop=sigmoid(output[5*K+1])>.69;
 return {step:[
     Math.max(-4,Math.min(4,dx)),
     Math.max(-4,Math.min(4,dy)),
     up?1:0
   ], stop};
}
function generateOnce(prefix,anchor,screenScale,seed){
 let state=new Float32Array(hiddenSize),out;
 // Teacher forcing: start symbol, then the observed movement tokens.
 out=evaluateStep([0,0,1],state);state=out.h;
 for(const token of prefix){
  out=evaluateStep(token,state);
  state=out.h;
 }
 const random=randomStream(seed);
 const paths=[];
 let points=[[anchor[0],anchor[1]]],x=anchor[0],y=anchor[1];
 let lifted=(prefix[prefix.length-1]?.[2]||0)>.5;
 const count=Math.min(34,model.architecture.max_generate||34);
 for(let i=0;i<count;i++){
  const choice=chooseMove(out.logits,random);
  const step=choice.step;
  let dx=step[0]*screenScale,dy=step[1]*screenScale;
  // Bound large sampled jumps to the whiteboard; do not invent trajectory.
  const length=Math.hypot(dx,dy);
  if(length>155){dx*=155/length;dy*=155/length}
  x+=dx;y+=dy;
  if(!Number.isFinite(x)||!Number.isFinite(y)||x<4||x>1196||y<4||y>546)break;
  if(lifted){
   if(points.length>1)paths.push(points);
   points=[[x,y]];
   lifted=false;
  }else{
   points.push([x,y]);
  }
  if(step[2]>.5){lifted=true;if(points.length>1)paths.push(points);points=[]}
  if(choice.stop&&i>=8)break;
  out=evaluateStep(step,state);
  state=out.h;
 }
 if(points.length>1)paths.push(points);
 return paths;
}
self.onmessage=e=>{
 const {cmd}=e.data;
 try{
  if(cmd==="init"){
   const payload=e.data.model;
   if(payload.format!=="ink-generative-gru-v1")throw Error("Bad generator format");
   model=payload;hiddenSize=payload.architecture.hidden;
   mixtures=payload.architecture.mixtures;
   scalePx=payload.architecture.scale_px;
   if(hiddenSize<8||hiddenSize>256||mixtures!==5)throw Error("Unsupported network dimensions");
   ih=decode(payload.weights.weight_ih);
   hh=decode(payload.weights.weight_hh);
   bih=Float32Array.from(payload.weights.bias_ih);
   bhh=Float32Array.from(payload.weights.bias_hh);
   head=decode(payload.weights.head_w);
   bhead=Float32Array.from(payload.weights.head_b);
   if(ih.w.length!==3*hiddenSize*3||hh.w.length!==3*hiddenSize*hiddenSize||
      head.w.length!==(mixtures*5+2)*hiddenSize)throw Error("Invalid generator shapes");
   self.postMessage({type:"ready"});
  }else if(cmd==="predict"){
   if(!model)throw Error("Neural generator not initialized");
   const {prefix,anchor,screenScale,serial,epoch}=e.data;
   if(!Array.isArray(prefix)||prefix.length<4)throw Error("Not enough pen movements");
   let hash=(prefix.length*19297 + Math.round(anchor[0]/26)*31+
             Math.round(anchor[1]/26)*127)|0;
   const paths=[];
   // Two independently sampled plausible continuations from the learned
   // Gaussian mixture (not geometric curves). Keep both semi-transparent.
   for(let k=0;k<2;k++){
    const generated=generateOnce(prefix,anchor,screenScale,hash+k*17391);
    paths.push(...generated);
   }
   self.postMessage({type:"prediction",serial,epoch,paths,neural:true});
  }
 }catch(error){
  self.postMessage({type:"error",message:String(error?.message||error)});
 }
};
</script>
<script>
"use strict";
(() => {
const MODEL_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v1.json";
const canvas=document.getElementById("pad"), ctx=canvas.getContext("2d",{willReadFrequently:true}), guess=document.getElementById("guess");
const ghostCanvas=document.getElementById("ghost"),ghostCtx=ghostCanvas.getContext("2d");
const assistButton=document.getElementById("assist");
let strokes=[],current=null,pointer=null,worker=null,loaded=false,requestId=0,readVersion=0,readTimer=0,tool="pen";
let assistEnabled=false,ghostCandidate=null;
const requests=new Map();
window.__inkReady=false;
window.__inkEngine="cnn";
window.__inkAssistEnabled=false;
window.__inkGhostPoints=0;
function display(text,muted=false){guess.textContent=text;guess.dataset.muted=muted?"true":"false"}
function chooseTool(next){
 if(next!=="pen"&&next!=="eraser")return;
 tool=next;canvas.dataset.tool=next;
 if(tool!=="pen"){clearGhost()}
 queueGhost();
 for(const name of ["pen","eraser"]){
  document.getElementById(name).setAttribute("aria-pressed",String(name===next));
 }
}
document.getElementById("pen").addEventListener("click",()=>chooseTool("pen"));
document.getElementById("eraser").addEventListener("click",()=>chooseTool("eraser"));

// Experimental Assist uses independently trained generative weights. NO
// curve extrapolation, font completion, heuristics, or other providers.
const SKETCH_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-sketch-gru-v1.json";
let sketchWorker=null,sketchReady=false,sketchLoading=false,sketchTimer=0;
let sketchBusy=false,sketchSerial=0,sketchActiveSerial=0,sketchRetry=0,sketchDirty=false,sketchEpoch=0;
window.__inkSketchReady=false;
window.__inkSketchEngine="neural-gru";
window.__inkLastSketchModelError="";

function clearGhost(){
 ghostCandidate=null;
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 window.__inkGhostPoints=0;
}
function queueGhost(){
 if(!assistEnabled||tool!=="pen"){clearGhost();return}
 if(!sketchReady){clearGhost();return}
 // Throttle generation to ~10 updates/sec; keep the drawing loop immediate.
 if(sketchBusy){sketchDirty=true;return}
 if(sketchTimer)return;
 sketchTimer=setTimeout(()=>{
  sketchTimer=0;generateGhost();
 },95);
}
function updateAssist(){
 assistEnabled=!assistEnabled;
 window.__inkAssistEnabled=assistEnabled;
 assistButton.setAttribute("aria-pressed",String(assistEnabled));
 assistButton.classList.toggle("assist-on",assistEnabled);
 if(!assistEnabled){
  ++sketchEpoch;sketchDirty=false;
  clearTimeout(sketchTimer);sketchTimer=0;clearGhost();
 }else{
  if(!sketchReady)loadSketchModel();
  queueGhost();
 }
}
assistButton.addEventListener("click",updateAssist);

function sketchPrefix(){
 // Convert actual ink into pen-movement tokens in Quick Draw's coordinate
 // system; these are inputs to the generative neural model, not fake paths.
 const penStrokes=(current?[...strokes,current]:strokes)
   .filter(s=>s.tool==="pen"&&s.points?.length>=2);
 if(!penStrokes.length)return null;
 let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
 for(const stroke of penStrokes)for(const p of stroke.points){
  left=Math.min(left,p[0]);top=Math.min(top,p[1]);
  right=Math.max(right,p[0]);bottom=Math.max(bottom,p[1]);
 }
 const extent=Math.max(90,right-left,bottom-top);
 const scale=180/extent,stepMin=Math.max(3.5,7.5/scale);
 const tokens=[];
 let previous=null;
 for(let i=0;i<penStrokes.length;i++){
  const stroke=penStrokes[i];
  const sample=[stroke.points[0]];
  for(let j=1;j<stroke.points.length;j++){
   const p=stroke.points[j],q=sample[sample.length-1];
   if(Math.hypot(p[0]-q[0],p[1]-q[1])>=stepMin ||
      j===stroke.points.length-1){
    sample.push(p);
   }
  }
  if(sample.length<2)continue;
  for(let j=0;j<sample.length;j++){
   const p=sample[j];
   if(previous!==null){
    const dx=Math.max(-4,Math.min(4,(p[0]-previous[0])*scale/20));
    const dy=Math.max(-4,Math.min(4,(p[1]-previous[1])*scale/20));
    tokens.push([dx,dy,0]);
   }
   previous=p;
  }
  if(tokens.length && stroke!==current)tokens[tokens.length-1][2]=1;
 }
 if(tokens.length<4||!previous)return null;
 return {prefix:tokens.slice(-72),anchor:previous,
         screenScale:20/scale};
}
function createSketchWorker(){
 if(sketchWorker)sketchWorker.terminate();
 const source=document.getElementById("sketchWorkerSource").textContent;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 sketchWorker=new Worker(url);
 URL.revokeObjectURL(url);
 sketchWorker.onmessage=e=>{
  const m=e.data;
  if(m.type==="ready"){
   sketchReady=true;sketchBusy=false;window.__inkSketchReady=true;
   assistButton.title="Neural Sketch Assist ready · press G to accept";
   queueGhost();
  }else if(m.type==="prediction"){
   sketchBusy=false;
   if(!assistEnabled||tool!=="pen"||m.epoch!==sketchEpoch)return;
   if(m.serial>=sketchActiveSerial){
    sketchActiveSerial=m.serial;
    ghostCandidate=m.paths||[];
    renderGhost();
   }
   // Recover the latest pointer state if a previous neural inference was busy.
   const needRefresh=sketchDirty||pointer!==null;
   sketchDirty=false;
   if(needRefresh)queueGhost();
  }else if(m.type==="error"){
   sketchBusy=false;
   window.__inkLastSketchModelError=m.message||"Neural generator failed";
   assistButton.title="Neural Assist unavailable: "+window.__inkLastSketchModelError;
  }
 };
 sketchWorker.onerror=e=>{
  sketchReady=false;sketchBusy=false;window.__inkSketchReady=false;
  window.__inkLastSketchModelError="Sketch worker failed";
 };
}
async function loadSketchModel(){
 if(sketchReady||sketchLoading)return;
 sketchLoading=true;
 assistButton.title="Loading independently trained sketch generator from GitHub…";
 try{
  const response=await fetch(SKETCH_URL,{cache:"no-store"});
  if(!response.ok)throw Error("Neural sketch model not published ("+response.status+")");
  const model=await response.json();
  if(model.format!=="ink-generative-gru-v1")throw Error("Incompatible sketch weights");
  createSketchWorker();
  sketchWorker.postMessage({cmd:"init",model});
  window.__inkLastSketchModelError="";
 }catch(error){
  window.__inkLastSketchModelError=String(error.message||error);
  assistButton.title="Neural sketch model pending on GitHub — no fake suggestions";
  if(assistEnabled){
   clearTimeout(sketchRetry);
   sketchRetry=setTimeout(()=>{if(assistEnabled&&!sketchReady)loadSketchModel()},30000);
  }
 }finally{sketchLoading=false}
}
function generateGhost(){
 if(!assistEnabled||!sketchReady||sketchBusy||tool!=="pen")return;
 const data=sketchPrefix();
 if(!data){clearGhost();return}
 sketchBusy=true;
 const serial=++sketchSerial;
 sketchWorker.postMessage({cmd:"predict",serial,epoch:sketchEpoch,...data});
}
function renderGhost(){
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 let count=0;
 const paths=Array.isArray(ghostCandidate)?ghostCandidate:[];
 const g=ghostCtx;
 g.save();
 g.strokeStyle="rgba(55,55,55,0.32)";
 g.lineCap="round";g.lineJoin="round";g.lineWidth=10;
 for(const path of paths){
  if(path.length<2)continue;
  count+=path.length;
  g.beginPath();
  g.moveTo(path[0][0],path[0][1]);
  for(let i=1;i<path.length;i++)g.lineTo(path[i][0],path[i][1]);
  g.stroke();
 }
 g.restore();
 window.__inkGhostPoints=count;
}
function acceptGhost(){
 if(!assistEnabled||tool!=="pen"||pointer!==null||!ghostCandidate?.length)return;
 const paths=ghostCandidate.filter(p=>p.length>=2);
 if(!paths.length)return;
 for(const points of paths){
  strokes.push({tool:"pen",points:points.map(p=>[p[0],p[1]])});
 }
 clearGhost();paint();schedule(75);
}
window.addEventListener("keydown",e=>{
 if(e.key.toLowerCase()==="g"&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.repeat&&
    !(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){
  acceptGhost();
 }
});

function paint(){
 ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.lineJoin="round";ctx.lineCap="round";
 for(const stroke of (current?[...strokes,current]:strokes)){
  const points=stroke.points;
  if(!points?.length)continue;
  ctx.strokeStyle=stroke.tool==="eraser"?"#fff":"#111";
  ctx.lineWidth=stroke.tool==="eraser"?46:12;
  ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
  if(points.length===1)ctx.lineTo(points[0][0]+.01,points[0][1]+.01);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
  ctx.stroke();
 }
 queueGhost();
}
paint();
function pos(e){
 const box=canvas.getBoundingClientRect();
 return [Math.max(0,Math.min(canvas.width,(e.clientX-box.left)*canvas.width/box.width)),
         Math.max(0,Math.min(canvas.height,(e.clientY-box.top)*canvas.height/box.height))];
}
function reset(){
 strokes=[];current=null;pointer=null;clearGhost();paint();++readVersion;
 clearTimeout(readTimer);display(loaded?"Draw something":"Loading AI…",true);
}
canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(pointer!==null)return;
 pointer=e.pointerId;current={tool,points:[pos(e)]};
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
});

canvas.addEventListener("pointermove",e=>{
 if(pointer!==e.pointerId||!current)return;
 e.preventDefault();current.points.push(pos(e));paint();
});
function finish(e){
 if(pointer!==e.pointerId)return;
 if(current){current.points.push(pos(e));strokes.push(current)}
 pointer=null;current=null;paint();schedule(180);
}
canvas.addEventListener("pointerup",finish);
canvas.addEventListener("pointercancel",finish);
window.addEventListener("keydown",e=>{
 if(e.key==="Escape"){reset();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
  e.preventDefault();strokes.pop();paint();schedule(100);
 }
});
function groupRuns(series,gap=2,minSpan=1){
 const ranges=[];let start=-1,last=-1;
 for(let i=0;i<=series.length;i++){
  if(i<series.length&&series[i]>0){if(start<0)start=i;last=i}
  else if(start>=0&&(i===series.length||i-last>gap)){
   if(last-start+1>=minSpan)ranges.push([start,last]);
   start=-1;last=-1;
  }
 }
 return ranges;
}
function segment(){
 const w=canvas.width,h=canvas.height,pixels=ctx.getImageData(0,0,w,h);
 const data=pixels.data,ink=new Uint8Array(w*h),rows=new Uint16Array(h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const off=(y*w+x)*4,idx=y*w+x;
  if(data[off]+data[off+1]+data[off+2]<620){ink[idx]=1;rows[y]++}
 }
 let lines=groupRuns(rows,22,2);
 // Dots above lowercase i/j or detached crossbars should stay on the same
 // handwriting line, rather than being mistaken for a new text line.
 function projections(top,bottom){
  const cols=new Uint16Array(w);
  for(let y=top;y<=bottom;y++)for(let x=0;x<w;x++)cols[x]+=ink[y*w+x];
  return cols;
 }
 let merged=[];
 for(const line of lines){
  const last=merged[merged.length-1];
  if(last){
   const gap=line[0]-last[1]-1;
   if(gap>22&&gap<=62){
    const topCols=projections(last[0],last[1]);
    const lowCols=projections(line[0],line[1]);
    const upper=groupRuns(topCols,2,1),lower=groupRuns(lowCols,2,1);
    const lowHeight=line[1]-line[0]+1,topHeight=last[1]-last[0]+1;
    const smallTop=topHeight<Math.min(33,lowHeight*.48)&&upper.length<=Math.max(1,lower.length);
    const aligned=upper.length>0&&upper.every(a=>lower.some(b=>
      (a[0]+a[1])/2>=b[0]-13&&(a[0]+a[1])/2<=b[1]+13));
    if(smallTop&&aligned){last[1]=line[1];continue}
   }
  }
  merged.push([...line]);
 }
 lines=merged;
 const found=[];
 for(let line=0;line<lines.length;line++){
  const [top,bottom]=lines[line],cols=projections(top,bottom);
  const initial=groupRuns(cols,2,2);
  const widths=initial.map(s=>s[1]-s[0]+1).sort((a,b)=>a-b);
  const typical=widths.length?widths[Math.floor(widths.length/2)]:30;
  const lineHeight=bottom-top+1;
  const spans=[];
  // When two handwritten letters touch, try a deep vertical valley, but
  // only for blobs much wider than a normally proportioned single letter.
  for(const [start,end] of initial){
   const wide=end-start+1;
   if(wide>Math.max(60,1.45*lineHeight) && (initial.length<=2||wide>1.8*typical)){
    let candidates=[];
    for(let x=start+15;x<=end-15;x++){
     if(cols[x]<=Math.max(2,lineHeight*.11)&&cols[x]<=cols[x-1]&&cols[x]<=cols[x+1])candidates.push(x);
    }
    const cuts=[],minWidth=Math.max(16,Math.min(36,lineHeight*.34));
    let previous=start;
    for(const x of candidates){
     if(x-previous>minWidth&&end-x>minWidth){cuts.push(x);previous=x}
    }
    if(cuts.length){
     let a=start;for(const x of cuts){spans.push([a,x]);a=x+1}spans.push([a,end]);continue;
    }
   }
   spans.push([start,end]);
  }
  const gaps=spans.slice(1).map((s,i)=>s[0]-spans[i][1]-1).sort((a,b)=>a-b);
  const common=gaps.length?gaps[Math.floor(gaps.length*.35)]:8;
  const spaceGap=Math.max(22,Math.min(125,Math.max(typical*.78,common*2.1)));
  for(let i=0;i<spans.length;i++){
   const [x0,x1]=spans[i];
   let y0=bottom,y1=top;
   for(let y=top;y<=bottom;y++)for(let x=x0;x<=x1;x++){
    if(ink[y*w+x]){y0=Math.min(y0,y);y1=Math.max(y1,y)}
   }
   if(y1<y0)continue;
   found.push({box:[x0,y0,x1,y1],line,space:i>0&&x0-spans[i-1][1]-1>spaceGap});
  }
 }
 return {regions:found,pixels};
}
function normalize(box,pixels){
 const [x0,y0,x1,y1]=box,w=x1-x0+1,h=y1-y0+1;
 const cropped=document.createElement("canvas");cropped.width=w;cropped.height=h;
 cropped.getContext("2d").putImageData(pixels,-x0,-y0);
 const out=document.createElement("canvas");out.width=32;out.height=32;
 const t=out.getContext("2d",{willReadFrequently:true});
 t.fillStyle="white";t.fillRect(0,0,32,32);
 const ratio=26/Math.max(w,h),tw=Math.max(1,Math.round(w*ratio)),th=Math.max(1,Math.round(h*ratio));
 t.imageSmoothingQuality="high";
 t.drawImage(cropped,0,0,w,h,(32-tw)/2,(32-th)/2,tw,th);
 const bytes=t.getImageData(0,0,32,32).data;
 const values=new Float32Array(1024);
 for(let i=0;i<1024;i++)values[i]=1-(bytes[4*i]+bytes[4*i+1]+bytes[4*i+2])/765;
 return Array.from(values);
}
function schedule(delay){
 ++readVersion;clearTimeout(readTimer);
 if(!loaded){display("Loading AI…",true);return}
 readTimer=setTimeout(()=>{if(pointer===null)recognize(readVersion)},delay);
}
function request(cmd,payload){
 return new Promise((resolve,reject)=>{
  if(!worker){reject(Error("AI not loaded"));return}
  const id=++requestId;
  requests.set(id,{resolve,reject});
  worker.postMessage({id,cmd,...payload});
  setTimeout(()=>{const r=requests.get(id);if(r){requests.delete(id);reject(Error("Recognition timed out"))}},30000);
 });
}
async function recognize(version){
 if(!loaded||version!==readVersion)return;
 const {regions,pixels}=segment();
 if(!regions.length){display("Draw something",true);return}
 try{
  const images=regions.map(r=>normalize(r.box,pixels));
  const {predictions}=await request("read",{images});
  if(version!==readVersion)return;
  let result="",lastLine=regions[0].line;
  function candidate(i,char){return predictions[i]?.top?.find(p=>p.char===char)}
  function neighboringType(i,step){
   let j=i+step;
   if(j<0||j>=regions.length)return "";
   if(regions[j].line!==regions[i].line)return "";
   if(step<0 && regions[i].space)return "";
   if(step>0 && regions[j].space)return "";
   const ch=predictions[j]?.top?.[0]?.char||"";
   if(/[0-9]/.test(ch))return "number";
   if(/[a-z]/.test(ch))return "lower";
   if(/[A-Z]/.test(ch))return "upper";
   return "";
  }
  for(let i=0;i<regions.length;i++){
   if(i&&regions[i].line!==lastLine){result+="\n";lastLine=regions[i].line}
   else if(i&&regions[i].space)result+=" ";
   const options=predictions[i].top;
   let ch=options[0].char;
   const before=neighboringType(i,-1),after=neighboringType(i,1);
   const ambiguous=["1","I","l","|","i"];
   if(ambiguous.includes(ch)){
    if((before==="number"||after==="number")&&candidate(i,"1"))ch="1";
    else if(before==="lower"||after==="lower"){
     if(candidate(i,"l"))ch="l";
     else if(candidate(i,"i")&&ch!=="I")ch="i";
    }else if((before==="upper"||after==="upper")&&candidate(i,"I"))ch="I";
   }
   result+=ch;
  }
  display(result);

 }catch(e){if(version===readVersion)display("Recognition unavailable",true)}
}
function createWorker(){
 const source=String.raw`
"use strict";
let labels=[],c1,c2,c3,f1,f2;
function unpack(layer){
 const raw=atob(layer.weights);
 const w=new Float32Array(raw.length),b=new Float32Array(layer.bias);
 for(let i=0;i<raw.length;i++){const value=raw.charCodeAt(i);w[i]=(value>127?value-256:value)*layer.scale}
 return {shape:layer.shape,w,b};
}
function conv(input,L,size){
 const [outChannels,inChannels,kernel]=L.shape,output=new Float32Array(outChannels*size*size),pad=(kernel-1)/2;
 for(let o=0;o<outChannels;o++)for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  let total=L.b[o];
  for(let i=0;i<inChannels;i++)for(let ky=0;ky<kernel;ky++){
   const sy=y+ky-pad;if(sy<0||sy>=size)continue;
   for(let kx=0;kx<kernel;kx++){
    const sx=x+kx-pad;if(sx<0||sx>=size)continue;
    const wi=((o*inChannels+i)*kernel+ky)*kernel+kx;
    total+=input[(i*size+sy)*size+sx]*L.w[wi];
   }
  }
  output[(o*size+y)*size+x]=total;
 }
 return output;
}
function pool(input,channels,size){
 const next=size/2,result=new Float32Array(channels*next*next);
 for(let c=0;c<channels;c++)for(let y=0;y<next;y++)for(let x=0;x<next;x++){
  const i=c*size*size+(y*2)*size+x*2;
  result[(c*next+y)*next+x]=Math.max(0,input[i],input[i+1],input[i+size],input[i+size+1]);
 }
 return result;
}
function dense(input,L,relu){
 const [count,length]=L.shape,result=new Float32Array(count);
 for(let o=0;o<count;o++){
  let value=L.b[o];
  const offset=o*length;
  for(let i=0;i<length;i++)value+=L.w[offset+i]*input[i];
  result[o]=relu?Math.max(0,value):value;
 }
 return result;
}
function predict(image){
 let a=pool(conv(Float32Array.from(image),c1,32),12,32);
 a=pool(conv(a,c2,16),24,16);
 a=pool(conv(a,c3,8),32,8);
 const logits=dense(dense(a,f1,true),f2,false);
 let high=-Infinity;
 for(let i=0;i<logits.length;i++)high=Math.max(high,logits[i]);
 const probabilities=Array.from(logits,v=>Math.exp((v-high)/1.25));
 const sum=probabilities.reduce((a,b)=>a+b,0);
 return {top:probabilities.map((p,i)=>({char:labels[i],confidence:p/sum}))
     .sort((a,b)=>b.confidence-a.confidence).slice(0,5)};
}
self.onmessage=e=>{
 const {id,cmd}=e.data;
 try{
  if(cmd==="init"){
   const m=e.data.model;
   if(m.format!=="ink-cnn-int8-v1"||m.layers?.length!==5)throw Error("Unsupported model");
   labels=m.labels;
   [c1,c2,c3,f1,f2]=m.layers.map(unpack);
   self.postMessage({id,result:{classes:labels.length}});
  }else if(cmd==="read"){
   self.postMessage({id,result:{predictions:e.data.images.map(predict)}});
  }else throw Error("Unsupported command");
 }catch(error){self.postMessage({id,error:String(error?.message||error)})}
};
`;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 worker=new Worker(url);
 URL.revokeObjectURL(url);
 worker.onmessage=e=>{
  const {id,result,error}=e.data;
  const pending=requests.get(id);if(!pending)return;
  requests.delete(id);
  if(error)pending.reject(Error(error));else pending.resolve(result);
 };
 worker.onerror=()=>{loaded=false;window.__inkReady=false;display("AI could not start",true)};
}
async function load(){
 display("Loading AI…",true);
 try{
  const response=await fetch(MODEL_URL,{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  const model=await response.json();
  if(model.format!=="ink-cnn-int8-v1"||model.layers?.length!==5)throw Error("Bad model data");
  createWorker();
  await request("init",{model});
  loaded=true;window.__inkReady=true;
  display("Draw something",true);
  if(strokes.length)schedule(80);
 }catch(error){
  display("AI unavailable — check connection",true);
  // GitHub access or publication may be temporary. Keep the canvas usable.
  setTimeout(()=>{if(!loaded)load()},15000);
 }
}
load();
})();
