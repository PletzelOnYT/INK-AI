<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>INK AI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080808}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
main{width:min(96vw,1300px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0}
.tools{display:flex;align-items:center;justify-content:center;gap:3px;align-self:center;padding:5px;background:#1b1b1b;border:1px solid #404040;border-radius:16px;box-shadow:0 6px 20px #0006}
.tool{width:48px;height:46px;display:grid;place-items:center;background:transparent;color:#ccc;border:0;border-radius:12px;cursor:pointer;transition:background .1s,color .1s}
.tool:hover{background:#343434;color:#fff}
.tool[aria-pressed="true"]{background:#fff;color:#0c0c0c}
.tool svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:focus-visible{outline:2px solid white;outline-offset:2px}
#pad[data-tool="eraser"]{cursor:cell}

/* The prediction layer is never part of the saved/recognized ink. */
.board{position:relative;width:100%;aspect-ratio:1200/550;background:#fff;border-radius:14px;overflow:hidden}
.board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ghost{pointer-events:none;z-index:2}
#pad{z-index:1}
.tool.assist-on{background:#ececec;color:#0b0b0b}
@media(max-width:650px){.board{aspect-ratio:1.14/1;border-radius:9px}}


#pad{background:#fff;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#guess{min-height:95px;padding:18px 20px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;color:#fff;font-size:clamp(24px,3vw,43px);font-weight:570;line-height:1.25;letter-spacing:-.02em}
#guess[data-muted="true"]{color:#8e8e8e;font-size:clamp(15px,2vw,23px);font-weight:400;letter-spacing:0}
@media(max-width:650px){main{padding:10px 0;gap:8px;justify-content:start}#pad{border-radius:0}#guess{min-height:80px}}
</style>
</head>
<body>
<main>
  <div class="tools" role="toolbar" aria-label="Drawing tools">
    <button id="pen" class="tool" type="button" aria-label="Pen" title="Pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4-12 12H4v-4L16 4Z"/><path d="m14 6 4 4"/></svg></button>
    <button id="eraser" class="tool" type="button" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.8 13.3-7.4 7.4H7.1l-3.6-3.6a2 2 0 0 1 0-2.8L14.2 3.6a2 2 0 0 1 2.8 0l3.8 3.8a2 2 0 0 1 0 2.8Z"/><path d="m9.5 8.3 7.2 7.2M13.4 20.7H21"/></svg></button>
    <button id="assist" class="tool" type="button" aria-label="Experimental neural stroke completion" title="AI completes handwritten letters, numbers and symbols · press G to accept" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17Z"/></svg></button>
  </div>
  <div class="board">
    <canvas id="pad" width="1200" height="550" data-tool="pen" aria-label="Write or draw here"></canvas>
    <canvas id="ghost" width="1200" height="550" aria-hidden="true"></canvas>
  </div>
  <div id="guess" data-muted="true" aria-live="polite">Loading AI…</div>
</main>
<script id="strokeWorkerSource" type="text/plain">
"use strict";
/* INK AI online handwriting generator: actual autoregressive GRU / MDN.
 * Each output is a pen trajectory. NO pixel reconstruction, glyph references,
 * raster skeletonization, nearest-neighbor, font templates or geometry paths.
 */
let network=null,characters=[],embedding=null,layers=[],outputWeight=null,outputBias=null;
let hiddenSize=0,embedSize=0,kCount=0,outputRows=0,maxSteps=48;
function unpack(obj){
 const bytes=atob(obj.weights),out=new Float32Array(bytes.length);
 for(let i=0;i<bytes.length;i++){
  const v=bytes.charCodeAt(i);out[i]=(v>127?v-256:v)*obj.scale;
 }
 return {w:out,shape:obj.shape};
}
function product(mat,x,row){
 const w=mat.w,n=mat.shape[1],offset=row*n;
 let sum=0;
 for(let i=0;i<n;i++)sum+=w[offset+i]*x[i];
 return sum;
}
function sig(v){return v>=0?1/(1+Math.exp(-v)):Math.exp(v)/(1+Math.exp(v))}
function step(token,states,characterEmbedding){
 const in0=new Float32Array(3+embedSize);
 in0.set(token);in0.set(characterEmbedding,3);
 let input=in0;
 for(let layer=0;layer<layers.length;layer++){
  const L=layers[layer],old=states[layer],H=hiddenSize;
  const gi=new Float32Array(H*3),gh=new Float32Array(H*3);
  const inputRows=L.ih.shape[1];
  // GRU weights follow PyTorch gate ordering (reset, update, candidate).
  for(let r=0;r<3*H;r++){
   const wi=r*inputRows,wh=r*H;
   let a=L.bi[r],b=L.bh[r];
   for(let j=0;j<inputRows;j++)a+=L.ih.w[wi+j]*input[j];
   for(let j=0;j<H;j++)b+=L.hh.w[wh+j]*old[j];
   gi[r]=a;gh[r]=b;
  }
  const next=new Float32Array(H);
  for(let j=0;j<H;j++){
   const reset=sig(gi[j]+gh[j]);
   const update=sig(gi[H+j]+gh[H+j]);
   const candidate=Math.tanh(gi[H*2+j]+reset*gh[H*2+j]);
   next[j]=candidate*(1-update)+old[j]*update;
  }
  states[layer]=next;input=next;
 }
 const output=new Float32Array(outputRows);
 for(let i=0;i<outputRows;i++){
  let value=outputBias[i],offset=i*hiddenSize;
  for(let j=0;j<hiddenSize;j++)value+=outputWeight.w[offset+j]*input[j];
  output[i]=value;
 }
 return output;
}
function hash(seed,label,serial){
 let x=((seed+serial*7919+label.charCodeAt(0)*6269)|0)^0x6c7d1f3b;
 return x||1729;
}
function rng(seed){
 let x=seed|0;
 return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296};
}
function normal(random){
 return Math.sqrt(-2*Math.log(Math.max(1e-8,random())))*
   Math.cos(6.283185307179586*random());
}
function sample(output,random,variation){
 const K=kCount;
 let mx=-Infinity;
 for(let j=0;j<K;j++)mx=Math.max(mx,output[j]);
 const weights=new Float32Array(K),temperature=variation?0.88:0.55;
 let sum=0;
 for(let j=0;j<K;j++){weights[j]=Math.exp((output[j]-mx)/temperature);sum+=weights[j]}
 let u=random()*sum,choice=K-1;
 for(let j=0;j<K;j++){u-=weights[j];if(u<=0){choice=j;break}}
 const jitter=variation?.34:.13;
 const sdX=Math.exp(Math.max(-5,Math.min(.6,output[3*K+choice])));
 const sdY=Math.exp(Math.max(-5,Math.min(.6,output[4*K+choice])));
 const dx=output[K+choice]+normal(random)*sdX*jitter;
 const dy=output[2*K+choice]+normal(random)*sdY*jitter;
 // Pen-up is a learned Bernoulli random variable, not an argmax gate.
 // This is essential for multi-stroke characters whose lift events are rare.
 const draw=random()<sig(output[5*K]);
 const stop=sig(output[5*K+1])>0.56;
 return {dx,dy,draw,stop};
}
// Class likelihood of the user's *real ordered prefix*, evaluated by the
// generative model itself; no retrieved reference images or templates.
function likelihood(output,actual){
 const k=kCount,dx=actual[0],dy=actual[1];
 let maxLogit=-Infinity;
 for(let i=0;i<k;i++)maxLogit=Math.max(maxLogit,output[i]);
 let norm=0;
 for(let i=0;i<k;i++)norm+=Math.exp(output[i]-maxLogit);
 let maxDensity=-Infinity;
 const values=[];
 for(let i=0;i<k;i++){
  const sx=Math.max(-5,Math.min(1,output[3*k+i]));
  const sy=Math.max(-5,Math.min(1,output[4*k+i]));
  const mx=output[k+i],my=output[2*k+i];
  const z=-Math.log(2*Math.PI)-sx-sy-
    .5*((dx-mx)*(dx-mx)*Math.exp(-2*sx)+
       (dy-my)*(dy-my)*Math.exp(-2*sy));
  const joint=output[i]-maxLogit-Math.log(norm)+z;
  values.push(joint);maxDensity=Math.max(maxDensity,joint);
 }
 let sum=0;for(const v of values)sum+=Math.exp(v-maxDensity);
 const draw=sig(output[5*k]),actualDraw=actual[2]>0.5;
 return maxDensity+Math.log(sum)+
   Math.log(Math.max(1e-5,actualDraw?draw:1-draw));
}
function completeGlyph(prefix,label,seed,variation){
 const index=characters.indexOf(label);
 if(index<0)throw Error("Unknown handwritten glyph: "+label);
 const charEmbedding=embedding.subarray(index*embedSize,(index+1)*embedSize);
 const states=layers.map(()=>new Float32Array(hiddenSize));
 let last=null,x=0,y=0,score=0;
 for(let j=0;j<prefix.length;j++){
  const token=prefix[j];
  if(token.length!==3||!token.every(Number.isFinite))throw Error("Invalid pen prefix");
  if(j>0)score+=likelihood(last,token);
  x+=token[0];y+=token[1];
  last=step(token,states,charEmbedding);
 }
 score/=Math.max(1,prefix.length-1);
 // Stable input-conditioned seed avoids flashing unrelated previews on
 // repeated repainting of identical user strokes.
 let inkHash=0;
 for(const v of prefix)for(const part of v)
  inkHash=(Math.imul(inkHash,31)+Math.round(part*300))|0;
 const rand=rng(hash(inkHash^seed,label,variation?19:0));
 let active=[[x,y]],paths=[],moves=0,penUps=0;
 for(let j=0;j<maxSteps;j++){
  if(!last)break;
  const predicted=sample(last,rand,variation);
  let {dx,dy,draw}=predicted;
  if(!Number.isFinite(dx)||!Number.isFinite(dy))break;
  // Reject unphysical pen-down leaps without inventing a continuation line.
  const length=Math.hypot(dx,dy);
  if(draw&&length>.12){dx*=.12/length;dy*=.12/length}
  if(!draw&&length>.8){dx*=.8/length;dy*=.8/length}
  const nx=x+dx,ny=y+dy;
  if(nx<-.08||nx>1.08||ny<-.08||ny>1.08)break;
  x=nx;y=ny;
  if(draw){
   active.push([x,y]);moves++;
  }else{
   if(active.length>1)paths.push(active);
   active=[[x,y]];penUps++;
  }
  last=step([dx,dy,draw?1:0],states,charEmbedding);
  if(predicted.stop&&j>=4)break;
 }
 if(active.length>1)paths.push(active);
 // Never emit empty previews or arbitrary shapes disconnected from input.
 return {paths,moves,penUps,prefixScore:score};
}
self.onmessage=e=>{
 const m=e.data;
 try{
  if(m.cmd==="init"){
   const o=m.model;
   if(o?.format!=="ink-online-stroke-mdn-v1")throw Error("Expected actual online stroke generator");
   if(o.architecture?.input!==3||o.architecture?.mixtures!==5||
      o.architecture?.layers!==2)throw Error("Unsupported GRU trajectory model");
   network=o;characters=o.labels;
   hiddenSize=o.architecture.hidden;embedSize=o.architecture.embed;
   kCount=o.architecture.mixtures;
   maxSteps=Math.min(64,o.architecture.max_generate||48);
   if(hiddenSize<24||hiddenSize>384||characters.length<100)
    throw Error("Unvalidated neural trajectory model dimensions");
   embedding=Float32Array.from(o.embedding.flat());
   layers=o.gru.map(l=>({ih:unpack(l.ih),hh:unpack(l.hh),
      bi:Float32Array.from(l.bias_ih),bh:Float32Array.from(l.bias_hh)}));
   outputWeight=unpack(o.head_weight);
   outputBias=Float32Array.from(o.head_bias);
   outputRows=5*kCount+2;
   for(let k=0;k<layers.length;k++){
    const expected=k===0?3+embedSize:hiddenSize;
    if(layers[k].ih.shape[0]!==3*hiddenSize||
       layers[k].ih.shape[1]!==expected||
       layers[k].hh.shape[1]!==hiddenSize)throw Error("Corrupt GRU weights");
   }
   if(outputWeight.shape[0]!==outputRows||
      outputWeight.shape[1]!==hiddenSize)throw Error("Corrupt trajectory head");
   self.postMessage({type:"ready",engine:"stroke-gru-mdn",
     parameters:o.parameter_count,classes:characters.length,
     realSamples:o.training.real_training_glyphs});
  }else if(m.cmd==="generate"){
   if(!network)throw Error("Neural generator is not initialized");
   const prefix=m.prefix,serial=m.serial,epoch=m.epoch;
   if(!Array.isArray(prefix)||prefix.length<2||prefix.length>120)
    throw Error("Insufficient genuine pen coordinates");
   const options=(m.options||[]).filter(o=>characters.includes(o.char))
     .slice(0,4);
   const results=[];
   let j=0;
   for(const choice of options){
    const result=completeGlyph(prefix,choice.char,serial*317+j*571,false);
    if(result.moves>2&&result.paths.length)results.push({
      label:choice.char,paths:result.paths,
      penUps:result.penUps,confidence:choice.confidence||0,
      score:result.prefixScore+0.25*Math.log((choice.confidence||0)+.03)
    });
    j++;
   }
   // Provide a second learned sample for Tab cycling when classifier
   // candidates are too ambiguous to yield two usable vector trajectories.
   if(results.length===1){
    const alt=completeGlyph(prefix,results[0].label,serial*997+31,true);
    if(alt.moves>2&&alt.paths.length){
     results.push({label:results[0].label,paths:alt.paths,
       penUps:alt.penUps,confidence:results[0].confidence,
       score:results[0].score-.15,variant:"stochastic"});
    }
   }
   results.sort((a,b)=>b.score-a.score);
   self.postMessage({type:"completion",serial,epoch,
       alternatives:results,neural:true,engine:"stroke-gru-mdn"});
  }else throw Error("Unknown neural generation command");
 }catch(error){
  self.postMessage({type:"error",serial:m.serial,epoch:m.epoch,
    message:String(error?.message||error)});
 }
};
</script>
<script>
"use strict";
(() => {
const MODEL_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v1.json";
const RECOGNITION_V2_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v2.json";
const RECOGNITION_V3_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-cnn-v3.json";
const canvas=document.getElementById("pad"), ctx=canvas.getContext("2d",{willReadFrequently:true}), guess=document.getElementById("guess");
const ghostCanvas=document.getElementById("ghost"),ghostCtx=ghostCanvas.getContext("2d");
const assistButton=document.getElementById("assist");
let strokes=[],current=null,pointer=null,worker=null,loaded=false,requestId=0,readVersion=0,readTimer=0,tool="pen";
let assistEnabled=false,ghostCandidate=null;
const requests=new Map();
window.__inkReady=false;
window.__inkEngine="cnn";
window.__inkRecognitionVersion=0;
window.__inkRecognitionAccuracy=0;
window.__inkDetectedRegions=0;
window.__inkLastGuess="";
window.__inkShapeOverride="";
window.__inkTopCandidates=[];
window.__inkAssistEnabled=false;
window.__inkGhostPoints=0;
function display(text,muted=false){guess.textContent=text;guess.dataset.muted=muted?"true":"false"}
function chooseTool(next){
 if(next!=="pen"&&next!=="eraser")return;
 tool=next;canvas.dataset.tool=next;
 if(tool!=="pen"){++glyphEpoch;clearGhost()}
 queueGhost();
 for(const name of ["pen","eraser"]){
  document.getElementById(name).setAttribute("aria-pressed",String(name===next));
 }
}
document.getElementById("pen").addEventListener("click",()=>chooseTool("pen"));
document.getElementById("eraser").addEventListener("click",()=>chooseTool("eraser"));

// Experimental Assist uses independently trained generative weights. NO
// curve extrapolation, font completion, heuristics, or other providers.
// Only the independent LETTER/DIGIT/SYMBOL completion model is allowed here.
// No Quick Draw sketches, no movement extrapolation, no third-party inference.
// Browser side of the real autoregressive stroke-sequence generator.
// Uses only real mouse/pen trajectories; neural worker returns pen-up/down
// vectors. No nearest neighbor, font glyph, bitmap, skeleton or templates.
const STROKE_URL="https://raw.githubusercontent.com/PletzelOnYT/INK-AI/main/models/ink-stroke-sequence-v1.json";
let glyphWorker=null,glyphReady=false,glyphLoading=false,glyphBusy=false;
let glyphTimer=0,glyphRetry=0,glyphSerial=0,glyphEpoch=0,glyphDirty=false;
let ghostPending=null,ghostOptions=[],ghostChoice=0;
window.__inkGlyphReady=false;
window.__inkAssistModel="online-stroke-gru";
window.__inkGlyphVersion=0;
window.__inkGlyphParameters=0;
window.__inkLastGlyphError="";
window.__inkHumanExamples=0;
window.__inkAssistLabel="";
window.__inkGhostSource="none";
window.__inkGhostSegments=0;
window.__inkGhostStrokeWidth=0;
window.__inkAcceptedVectorCount=0;
window.__inkSuggestionChoices=[];
function clearGhost(){
 ghostCandidate=null;ghostOptions=[];ghostChoice=0;ghostPending=null;
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 window.__inkGhostPoints=0;window.__inkGhostSegments=0;
 window.__inkAssistLabel="";window.__inkGhostSource="none";
 window.__inkSuggestionChoices=[];
}
function queueGhost(){
 if(!assistEnabled||tool!=="pen"){clearGhost();return}
 if(!glyphReady){clearGhost();return}
 if(glyphBusy){glyphDirty=true;return}
 if(glyphTimer)return;
 glyphTimer=setTimeout(()=>{glyphTimer=0;generateGlyph()},120);
}
function updateAssist(){
 assistEnabled=!assistEnabled;
 window.__inkAssistEnabled=assistEnabled;
 assistButton.setAttribute("aria-pressed",String(assistEnabled));
 assistButton.classList.toggle("assist-on",assistEnabled);
 ++glyphEpoch;
 if(!assistEnabled){
  clearTimeout(glyphTimer);glyphTimer=0;glyphDirty=false;clearGhost();
 }else{
  if(!glyphReady)loadGlyphModel();
  queueGhost();
 }
}
assistButton.addEventListener("click",updateAssist);
function bounds(stroke){
 let l=Infinity,r=-Infinity,t=Infinity,b=-Infinity;
 for(const [x,y] of stroke.points){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y)}
 return {l,r,t,b};
}
function completionInput(){
 const list=current?[...strokes,current]:strokes;
 let start=0;
 for(let i=list.length-1;i>=0;i--)if(list[i].tool==="eraser"){start=i+1;break}
 const recent=list.slice(start).filter(s=>s.tool==="pen"&&s.points?.length>=2);
 if(!recent.length)return null;
 const group=[recent[recent.length-1]];
 let box=bounds(group[0]);
 for(let i=recent.length-2;i>=Math.max(0,recent.length-7);i--){
  const n=bounds(recent[i]);
  const dx=Math.max(0,n.l-box.r,box.l-n.r),dy=Math.max(0,n.t-box.b,box.t-n.b);
  if(dx>48||dy>65||Math.max(box.r,n.r)-Math.min(box.l,n.l)>280)break;
  group.unshift(recent[i]);
  box={l:Math.min(box.l,n.l),r:Math.max(box.r,n.r),
       t:Math.min(box.t,n.t),b:Math.max(box.b,n.b)};
 }
 const frameSize=Math.max(105,Math.min(290,Math.max(box.r-box.l,box.b-box.t)*1.4));
 const frame={x:box.l-frameSize*.16,y:box.t-frameSize*.16,size:frameSize};
 const prefix=[];let prev=[frame.x,frame.y];
 for(const stroke of group){
  const pts=stroke.points,selected=[pts[0]];
  for(let j=1;j<pts.length;j++){
   const p=pts[j],q=selected[selected.length-1];
   if(Math.hypot(p[0]-q[0],p[1]-q[1])>=Math.max(4,frameSize*.019)||
      j===pts.length-1)selected.push(p);
  }
  for(let j=0;j<selected.length;j++){
   const p=selected[j];
   prefix.push([(p[0]-prev[0])/frameSize,(p[1]-prev[1])/frameSize,j?1:0]);
   prev=p;
  }
 }
 if(prefix.length<2)return null;
 if(prefix.length>85){
  // Reframe only the current stroke; never truncate away the absolute token.
  const p=group[group.length-1].points,selected=[];
  const stride=Math.max(1,Math.ceil(p.length/55));
  for(let j=0;j<p.length;j+=stride)selected.push(p[j]);
  if(selected.length<2)return null;
  const b=bounds(group[group.length-1]);
  const sz=Math.max(105,Math.min(290,Math.max(b.r-b.l,b.b-b.t)*1.4));
  const f={x:b.l-sz*.16,y:b.t-sz*.16,size:sz};
  let prev=[f.x,f.y],short=[];
  selected.forEach((p,j)=>{
   short.push([(p[0]-prev[0])/sz,(p[1]-prev[1])/sz,j?1:0]);
   prev=p;
  });
  return {frame:f,prefix:short};
 }
 return {frame,prefix};
}
function createGlyphWorker(){
 if(glyphWorker)glyphWorker.terminate();
 const source=document.getElementById("strokeWorkerSource").textContent;
 const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
 glyphWorker=new Worker(url);URL.revokeObjectURL(url);
 glyphWorker.onmessage=e=>{
  const m=e.data;
  if(m.type==="ready"){
   glyphReady=true;glyphBusy=false;
   window.__inkGlyphReady=true;window.__inkGlyphVersion=3;
   window.__inkGlyphParameters=m.parameters;
   assistButton.title="Neural handwriting strokes · Tab alternatives · G accept";
   queueGhost();
  }else if(m.type==="completion"){
   glyphBusy=false;
   if(assistEnabled&&tool==="pen"&&m.neural===true&&
      m.epoch===glyphEpoch&&m.serial===glyphSerial&&
      ghostPending?.serial===m.serial&&!glyphDirty){
     ghostOptions=(m.alternatives||[]).filter(o=>o.paths?.some(p=>p.length>1));
     window.__inkSuggestionChoices=ghostOptions.map(o=>o.label);
     ghostChoice=0;setGhostChoice(0);
   }
   const dirty=glyphDirty;glyphDirty=false;
   if(dirty||pointer!==null)queueGhost();
  }else if(m.type==="error"){
   glyphBusy=false;window.__inkLastGlyphError=m.message||"Neural generation failed";
   assistButton.title=window.__inkLastGlyphError;
  }
 };
 glyphWorker.onerror=()=>{
  glyphReady=false;glyphBusy=false;window.__inkGlyphReady=false;
  window.__inkLastGlyphError="Neural trajectory worker failed";
 };
}
async function loadGlyphModel(){
 if(glyphReady||glyphLoading)return;
 glyphLoading=true;
 assistButton.title="Loading trained pen-trajectory model…";
 try{
  const sources=location.protocol==="file:"?[STROKE_URL]:

 const [outChannels,inChannels,kernel]=L.shape,output=new Float32Array(outChannels*size*size),pad=(kernel-1)/2;
 for(let o=0;o<outChannels;o++)for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  let total=L.b[o];
  for(let i=0;i<inChannels;i++)for(let ky=0;ky<kernel;ky++){
   const sy=y+ky-pad;if(sy<0||sy>=size)continue;
   for(let kx=0;kx<kernel;kx++){
    const sx=x+kx-pad;if(sx<0||sx>=size)continue;
    const wi=((o*inChannels+i)*kernel+ky)*kernel+kx;
    total+=input[(i*size+sy)*size+sx]*L.w[wi];
   }
  }
  output[(o*size+y)*size+x]=total;
 }
 return output;
}
function pool(input,channels,size){
 const next=size/2,result=new Float32Array(channels*next*next);
 for(let c=0;c<channels;c++)for(let y=0;y<next;y++)for(let x=0;x<next;x++){
  const i=c*size*size+(y*2)*size+x*2;
  result[(c*next+y)*next+x]=Math.max(0,input[i],input[i+1],input[i+size],input[i+size+1]);
 }
 return result;
}
function dense(input,L,relu){
 const [count,length]=L.shape,result=new Float32Array(count);
 for(let o=0;o<count;o++){
  let value=L.b[o];
  const offset=o*length;
  for(let i=0;i<length;i++)value+=L.w[offset+i]*input[i];
  result[o]=relu?Math.max(0,value):value;
 }
 return result;
}
function predict(image){
 let a=pool(conv(Float32Array.from(image),c1,32),12,32);
 a=pool(conv(a,c2,16),24,16);
 a=pool(conv(a,c3,8),32,8);
 const logits=dense(dense(a,f1,true),f2,false);
 let high=-Infinity;
 for(let i=0;i<logits.length;i++)high=Math.max(high,logits[i]);
 const probabilities=Array.from(logits,v=>Math.exp((v-high)/1.25));
 const sum=probabilities.reduce((a,b)=>a+b,0);
 return {top:probabilities.map((p,i)=>({char:labels[i],confidence:p/sum}))
     .sort((a,b)=>b.confidence-a.confidence).slice(0,5)};
}
self.onmessage=e=>{

async function load(){
 display("Loading AI…",true);
 try{
  let model=null,version=1;
  const candidates=[
   {version:3,relative:"models/ink-cnn-v3.json",remote:RECOGNITION_V3_URL,
       parent:"models/ink-cnn-v2.json"},
   {version:2,relative:"models/ink-cnn-v2.json",remote:RECOGNITION_V2_URL,
       parent:"models/ink-cnn-v1.json"}
  ];
  for(const entry of candidates){
   const urls=location.protocol==="file:"?[entry.remote]:
     [entry.relative,entry.remote];
   for(const url of urls){
    try{
     const r=await fetch(url,{cache:"no-store"});
     if(!r.ok)continue;
     const candidate=await r.json();
     if(candidate.format!=="ink-cnn-int8-v1"||candidate.layers?.length!==5)continue;
     if(candidate.training?.finetuned_from!==entry.parent)continue;
     if(candidate.labels?.length!==102||candidate.input?.join(",")!=="1,32,32")continue;
     model=candidate;version=entry.version;break;
    }catch(_){/* Newer checkpoint is optional. Original model remains safe. */}
   }
   if(model)break;
  }
  if(!model){
   const response=await fetch(MODEL_URL,{cache:"no-store"});
   if(!response.ok)throw Error("HTTP "+response.status);
   model=await response.json();
  }
  if(model.format!=="ink-cnn-int8-v1"||model.layers?.length!==5)
    throw Error("Bad model data");
  createWorker();
  await request("init",{model});
  window.__inkRecognitionVersion=version;
  window.__inkRecognitionAccuracy=model.training?.emnist_test_accuracy||0;
  window.__inkRecognitionPenAccuracy=model.training?.uji_independent_accuracy||null;
  loaded=true;window.__inkReady=true;
  display("Draw something",true);
  if(strokes.length)schedule(80);
 }catch(error){
  display("AI unavailable — check connection",true);
  setTimeout(()=>{if(!loaded)load()},15000);
 }
}
