<svg xmlns="http://www.w3.org/2000/svg" width="920" height="575" viewBox="0 0 920 575" role="img" aria-label="INK AI | Model and system benchmarks"><rect width="920" height="575" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" font-size="26" font-weight="bold" fill="#202124">INK AI | Model and system benchmarks</text><text x="36" y="70" font-size="14" fill="#5f6368">Distinct datasets and metrics; bars should not be compared directly.</text><text x="45" y="122" font-size="15" fill="#30343a" font-weight="bold">Handwriting CNN V3 | unseen-writer accuracy</text><rect x="45" y="132" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="132" width="508.53" height="23" rx="6" fill="#4285f4"/><text x="730" y="150" font-size="17" fill="#30343a">76.47%</text><text x="45" y="227" font-size="15" fill="#30343a" font-weight="bold">Completer Domain V2 | trajectory error reduction</text><rect x="45" y="237" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="237" width="141.58" height="23" rx="6" fill="#4285f4"/><text x="730" y="255" font-size="17" fill="#30343a">21.29%</text><text x="45" y="332" font-size="15" fill="#30343a" font-weight="bold">Printed CNN V1 | independent synthetic font accuracy</text><rect x="45" y="342" width="665" height="23" rx="6" fill="#eceff1"/><text x="730" y="360" font-size="14" fill="#68737d">Not measured</text><text x="45" y="437" font-size="15" fill="#30343a" font-weight="bold">Camera | real-photo word accuracy</text><rect x="45" y="447" width="665" height="23" rx="6" fill="#eceff1"/><text x="730" y="465" font-size="14" fill="#68737d">Not measured</text><text x="45" y="550" font-size="13" fill="#59626b">No synthetic-font metric is labeled as real camera accuracy.</text></g></svg>