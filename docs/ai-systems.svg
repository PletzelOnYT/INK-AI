<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img" aria-label="INK AI | Model and system benchmarks"><rect width="920" height="590" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="46" font-size="26" font-weight="bold" fill="#202124">INK AI | Model and system benchmarks</text><text x="36" y="76" font-size="14" fill="#5f6368">Different metrics, different datasets. Bar heights must not be compared as one score.</text><text x="45" y="116" font-size="15" fill="#30343a" font-weight="bold">Handwriting CNN V3 | UJI held-out writers | character accuracy</text><rect x="45" y="135" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="135" width="508.50" height="23" rx="6" fill="#4285f4"/><text x="730" y="153" font-size="17" fill="#30343a" font-weight="bold">76.47%</text><text x="45" y="221" font-size="15" fill="#30343a" font-weight="bold">Completer Domain V2 | reduction in pen trajectory error</text><rect x="45" y="240" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="240" width="141.60" height="23" rx="6" fill="#4285f4"/><text x="730" y="258" font-size="17" fill="#30343a" font-weight="bold">21.29%</text><text x="45" y="326" font-size="15" fill="#30343a" font-weight="bold">Printed CNN V1 | synthetic held-out fonts | character accuracy</text><rect x="45" y="345" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="345" width="556.55" height="23" rx="6" fill="#4285f4"/><text x="730" y="363" font-size="17" fill="#30343a" font-weight="bold">83.69%</text><text x="45" y="431" font-size="15" fill="#30343a" font-weight="bold">Camera OCR | real-world complete-word accuracy</text><rect x="45" y="450" width="665" height="23" rx="6" fill="#eceff1"/><text x="730" y="468" font-size="14" fill="#68737d">Not measured</text><text x="45" y="547" font-size="13" fill="#59626b">Handwriting and completion figures: existing repository benchmark graphs.</text></g></svg>