<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-label="Camera printed-text recognition"><rect width="920" height="460" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="46" font-size="26" font-weight="bold" fill="#202124">Camera printed-text recognition</text><text x="36" y="76" font-size="14" fill="#5f6368">Synthetic-font evaluation is NOT a webcam benchmark.</text><text x="45" y="119" font-size="15" fill="#30343a" font-weight="bold">PRINT CNN V1 | Character accuracy on independent font families</text><rect x="45" y="138" width="665" height="23" rx="6" fill="#eceff1"/><rect x="45" y="138" width="556.55" height="23" rx="6" fill="#4285f4"/><text x="730" y="156" font-size="17" fill="#30343a" font-weight="bold">83.69%</text><text x="45" y="213" font-size="15" fill="#30343a" font-weight="bold">Camera | Correct complete words on real photos</text><rect x="45" y="232" width="665" height="23" rx="6" fill="#eceff1"/><text x="730" y="250" font-size="14" fill="#68737d">Not measured</text><text x="45" y="334" font-size="14" fill="#30343a">Holdout: 1116 synthetic glyphs across 3 fonts; trained from scratch.</text><text x="45" y="375" font-size="14" fill="#30343a">All text/background colors: local RGB contrast detection; real-camera validation pending.</text><text x="45" y="412" font-size="13" fill="#59626b">New systems must supply independently measured metrics. Unknown values stay unplotted.</text></g></svg>