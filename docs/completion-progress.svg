<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-label="Completion models — measured progress"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1520"/><stop offset="1" stop-color="#101b28"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1faa83"/><stop offset="1" stop-color="#65e0ae"/></linearGradient></defs><rect x="0" y="0" width="1120" height="750" rx="0" fill="url(#bg)" /><rect x="42" y="36" width="7" height="61" rx="3" fill="#35c693" /><text x="68" y="62" fill="#f3faf9" font-size="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >Completion models — measured progress</text><text x="68" y="88" fill="#9fb1c2" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >Two types of completers were tested. Their metrics are not interchangeable.</text><rect x="42" y="124" width="1036" height="224" rx="18" fill="#141e2a" stroke="#2b3848" stroke-width="1.4"/><text x="74" y="160" fill="#fff" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >ARCHIVED IMAGE COMPLETION — NO LONGER ACTIVE</text><text x="74" y="186" fill="#98acbe" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >Missing-ink F1 · same 4,000 held-out character masks</text><text x="74" y="226" fill="#d7e6ef" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >Raster V1</text><rect x="278" y="209" width="574" height="24" rx="8" fill="#243447" /><rect x="278" y="209" width="365.888838" height="24" rx="8" fill="#708ca2" /><text x="878" y="228" fill="#708ca2" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >63.74%</text><text x="74" y="277" fill="#d7e6ef" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >Raster V2</text><rect x="278" y="260" width="574" height="24" rx="8" fill="#243447" /><rect x="278" y="260" width="383.7672159999999" height="24" rx="8" fill="url(#bar)" /><text x="878" y="279" fill="url(#bar)" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >66.86%</text><text x="74" y="325" fill="#9dd9bb" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >+3.11 F1 percentage points; these are mask predictions, not the live GRU.</text><rect x="42" y="368" width="1036" height="325" rx="18" fill="#141e2a" stroke="#2b3848" stroke-width="1.4"/><text x="74" y="407" fill="#fff" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >ACTIVE NEURAL STROKE COMPLETION — GRU</text><text x="74" y="435" fill="#98acbe" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >Measured reduction in pen-path error; a lower number is better</text><rect x="74" y="454" width="465" height="158" rx="14" fill="#1c2a38" /><rect x="557" y="454" width="489" height="158" rx="14" fill="#1c2a38" /><text x="95" y="481" fill="#d5e7ef" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >V1 → PREFIX V1</text><text x="95" y="510" fill="#fff" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >0.2112  →  0.1958</text><text x="95" y="548" fill="#66e3b0" font-size="33" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >7.28%</text><text x="230" y="548" fill="#b5cbdb" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >LESS ERROR</text><text x="95" y="585" fill="#96afc0" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >14-step rollout · 1,550 unseen-writer glyphs</text><text x="577" y="481" fill="#d5e7ef" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >PREFIX V1 → DOMAIN V2</text><text x="577" y="510" fill="#fff" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >0.4238  →  0.3336</text><text x="577" y="548" fill="#66e3b0" font-size="33" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >21.29%</text><text x="715" y="548" fill="#b5cbdb" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >LESS ERROR</text><text x="577" y="585" fill="#96afc0" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >12-step prefix evaluation · distinct benchmark</text><text x="74" y="650" fill="#f0b77d" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" >Pen-lift detection (deployed GRU): 0% F1</text><text x="74" y="677" fill="#c4d5df" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >A reliable whole-character completion success rate has not been measured.</text><text x="74" y="703" fill="#94a8b9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" >Larger stroke V2 and pen-lift V3 experiments did not pass release gates.</text></svg>