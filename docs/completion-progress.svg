<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="625" viewBox="0 0 1060 625" role="img" aria-label="Handwriting completer"><rect width="1060" height="625" fill="#ffffff"/><text x="55" y="53" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#202124">Handwriting completer</text><text x="55" y="80" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5f6368">Measured results by engine · different metrics are shown separately</text><text x="55" y="124" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#202124">Raster completion — archived</text><text x="55" y="147" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5f6368">Missing-ink F1 · same 4,000 held-out masks (higher is better)</text><line x1="235" y1="164" x2="235" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="235" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">0%</text><line x1="378" y1="164" x2="378" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="378" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">20%</text><line x1="521" y1="164" x2="521" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="521" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">40%</text><line x1="664" y1="164" x2="664" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="664" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">60%</text><line x1="807" y1="164" x2="807" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="807" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">80%</text><line x1="950" y1="164" x2="950" y2="268" stroke="#e8eaed" stroke-width="1"/><text x="950" y="296" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">100%</text><tex