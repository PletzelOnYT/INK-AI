" stroke-width="1"/><text x="950" y="525" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">25%</text><text x="220" y="436" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202124">Prefix V1 · 14-step</text><rect x="235" y="417" width="208.21" height="25" fill="#4285f4"/><text x="452.20799999999997" y="436" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124">7.28%</text><text x="220" y="479" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202124">Domain V2 · 12-step</text><rect x="235" y="460" width="608.89" height="25" fill="#4285f4"/><text x="852.8939999999999" y="479" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202124">21.29%</text><text x="55" y="586" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">GRU bars show error reduction, not suggestion success. The 14-step and 12-step tests differ.</text><text x="55" y="607" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f6368">Whole-character suggestion success has not yet been measured.</text></svg>