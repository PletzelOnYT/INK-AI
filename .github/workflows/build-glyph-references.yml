name: Build genuine handwritten glyph reference bank
on:
  push:
    branches: [main]
    paths:
      - "src/build_glyph_references.py"
      - ".github/workflows/build-glyph-references.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-glyph-references
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Extract genuine writer-produced glyph examples
        run: python -u src/build_glyph_references.py
      - name: Verify compact examples data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("models/ink-human-glyph-references.json").read_text())
          assert m["format"]=="ink-human-glyph-examples-v1"
          assert m["total_examples"]>5000
          assert len(m["per_class"]["I"])>100
          assert len(m["per_class"]["l"])>100
          assert len(m["per_class"]["1"])>100
          print("Verified",m["total_examples"],"reference examples",flush=True)
          PY
      - name: Publish reference bank to GitHub
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ink-human-glyph-references.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish real handwritten glyph reference bank"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-real-glyph-prototypes
          path: models/ink-human-glyph-references.json
          if-no-files-found: ignore
