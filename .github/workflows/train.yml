name: Train INK AI handwriting model
on:
  push:
    branches: [main]
    paths:
      - "src/train.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-ai-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install training dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Download real handwriting and train INK CNN from scratch
        run: |
          python src/train.py --epochs 4 --batch 256 --hasy
      - name: Commit independently trained model to this repository
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ink-cnn-v1.json models/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish INK AI model trained on real handwritten examples"
            # The source branch can change during a long CPU training run.
            # Integrate any new frontend commits instead of rejecting a non-fast-forward push.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-ai-trained-model
          path: models/
          if-no-files-found: ignore
