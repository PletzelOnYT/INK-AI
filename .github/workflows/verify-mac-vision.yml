name: Verify optional Apple Vision companion
on:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - "src/camera_vision_bridge.js"
      - "tests/camera-vision-bridge.mjs"
      - ".github/workflows/verify-mac-vision.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-vision:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher script
        run: bash -n mac/start-ink-vision.sh
      - name: Compile macOS Vision OCR natively
        run: |
          swiftc -O mac/InkVisionServer.swift \
            -framework Vision -framework AppKit -framework ImageIO \
            -o /tmp/ink-ai-vision-server
      - name: Test real macOS Vision OCR on dark and light labels
        run: /tmp/ink-ai-vision-server --selftest
      - name: Verify browser-side secure loopback OCR and text highlight
        run: node tests/camera-vision-bridge.mjs
