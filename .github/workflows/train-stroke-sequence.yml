name: Train genuine online handwriting stroke generator
on:
  push:
    branches: [main]
    paths:
      - "src/train_stroke_sequence.py"
      - "tests/stroke-training-unit.py"
      - ".github/workflows/train-stroke-sequence.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-online-stroke-generator
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements.txt
      - name: Check true UJI stroke parser and all 102 class recipes
        run: python tests/stroke-training-unit.py
      - name: Train generative recurrent mixture model on authentic pen trajectories
        run: python -u src/train_stroke_sequence.py --epochs 6 --fine-epochs 2 --batch 128 --hidden 192
      - name: Validate genuine learned stroke sequence checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("models/ink-stroke-sequence-v1.json").read_text())
          m=json.loads(Path("models/stroke-sequence-metrics.json").read_text())
          assert d["format"]=="ink-online-stroke-mdn-v1"
          assert d["architecture"]["layers"]==2
          assert d["training"]["trained_from_scratch"] is True
          assert d["training"]["not_a_raster_generator"] is True
          assert d["training"]["real_training_glyphs"]>6000
          assert d["training"]["real_writer_holdout_glyphs"]>1800
          assert d["training"]["all_supported_classes"]>=100
          assert len(d["gru"])==2
          assert 0<m["best"]<50
          assert d["training"]["metrics"]["heldout_glyphs"]>1800
          print("VERIFIED neural stroke generator:",d["parameter_count"],"parameters",m["best"],flush=True)
          PY
      - name: Publish new neural sequence model without overwriting older handwriting recognition
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ink-stroke-sequence-v1.json models/stroke-sequence-metrics.json
          git commit -m "Publish independently trained online handwriting sequence generator"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-ai-neural-pen-trajectories
          path: |
            models/ink-stroke-sequence-v1.json
            models/stroke-sequence-metrics.json
          if-no-files-found: ignore
