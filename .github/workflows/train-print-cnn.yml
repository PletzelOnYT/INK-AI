name: Train and publish INK printed-text CNN
on:
  push:
    branches: [main]
    paths:
      - "src/train_print_cnn.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: print-training
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Python tools for independent first-party CNN training
        run: python3 -m pip install --quiet torch numpy pillow
      - name: Train and evaluate on held-out font families
        run: python3 src/train_print_cnn.py --epochs 5 --samples 24000
      - name: Reject incomplete or misleading benchmark output
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open("models/print-cnn-v1-metrics.json"))
          p=json.load(open("models/ink-print-cnn-v1.json"))
          assert m["trained_from_scratch"]
          assert m["heldout_font_count"]>=2 and m["heldout_characters"]>=500
          assert 0<=m["heldout_accuracy"]<=1
          assert p["training"]["heldout_accuracy"]==m["heldout_accuracy"]
          assert m["real_camera_word_accuracy"] is None
          PY
      - name: Publish against current repository main
        run: |
          cp models/ink-print-cnn-v1.json /tmp/ink-print-cnn-v1.json
          cp models/print-cnn-v1-metrics.json /tmp/print-cnn-v1-metrics.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ink-print-cnn-v1.json models/ink-print-cnn-v1.json
          cp /tmp/print-cnn-v1-metrics.json models/print-cnn-v1-metrics.json
          npm install --no-audit --no-fund --ignore-scripts
          npm run build:ocr
          python3 scripts/build_standalone.py
          cp dist/ink-ai-standalone.html index.html
          node --check src/camera_ocr.js
          node tests/camera-local-ocr.mjs
      - name: Commit trained model, exact measurements and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ink-print-cnn-v1.json models/print-cnn-v1-metrics.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Train printed-text CNN and update standalone HTML"
            git push origin HEAD:main
          fi
