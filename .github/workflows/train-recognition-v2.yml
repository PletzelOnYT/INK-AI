name: Improve handwritten character recognition V2
on:
  push:
    branches: [main]
    paths:
      - "src/train_recognition_v2.py"
      - ".github/workflows/train-recognition-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-recognition-v2
  cancel-in-progress: false
jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install training environment
        run: python -m pip install -r requirements.txt
      - name: Fine-tune real handwriting recognizer with balanced lowercase classes
        run: |
          python -u src/train_recognition_v2.py \
            --epochs 3 --samples-per-epoch 160000 --batch 256
      - name: Check all held-out accuracy metrics before deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("models/recognition-v2-metrics.json").read_text())
          b=x["baseline"]
          print("Baseline overall",b["overall"],"macro",b["macro"],"lowercase",b["lowercase_macro"])
          print("Best eligible",x["best"])
          if x["best"] is not None:
              m=x["best"]["metrics"]
              assert m["overall"] >= b["overall"]-.015
              assert m["macro"] >= b["macro"]+.010
              assert m["lowercase_macro"] >= b["lowercase_macro"]+.020
              model=json.loads(Path("models/ink-cnn-v2.json").read_text())
              assert model["format"]=="ink-cnn-int8-v1"
              assert model["training"]["finetuned_from"]=="models/ink-cnn-v1.json"
              assert len(model["layers"])==5
              print("Recognizing more minority classes; V2 cleared acceptance")
          else:
              print("No safe improvement; preserving original recognition model")
          PY
      - name: Publish only genuine validated improved recognizer
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/recognition-v2-metrics.json
          if test -s models/ink-cnn-v2.json; then
            git add models/ink-cnn-v2.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified minority-class handwriting recognition improvements"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-recognition-v2-results
          path: |
            models/ink-cnn-v2.json
            models/recognition-v2-metrics.json
          if-no-files-found: ignore
