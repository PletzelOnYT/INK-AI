name: Improve learned pen lifts for handwriting and symbols
on:
  push:
    branches: [main]
    paths:
      - "src/train_pen_lift_head_v3.py"
      - "tests/pen-lift-head-unit.py"
      - ".github/workflows/train-penlift-v3.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-pen-lift-v3
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify that vector outputs remain frozen during rare pen-lift training
        run: |
          python -m py_compile src/train_pen_lift_head_v3.py
          python -u tests/pen-lift-head-unit.py
      - name: Tune actual pen-lift probabilities from real online handwriting
        run: |
          python -u src/train_pen_lift_head_v3.py \
            --epochs 12 --per-epoch 32000 --batch 96 \
            --loss balanced-bce --lift-weight 11
      - name: Enforce independent pen-up and drawing geometry quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("models/penlift-v3-metrics.json").read_text())
          assert r["test_glyphs"]>1000
          assert r["seen"]>25000
          if r["eligible"]:
              model=json.loads(Path("models/ink-stroke-penlift-v3.json").read_text())
              assert model["format"]=="ink-online-stroke-mdn-v1"
              assert model["training"]["penlift_calibrated_v3"] is True
              assert model["training"]["pen_lift_bias_calibrated"] is True
              assert isinstance(r["best_bias_offset"],(int,float))
              assert model["training"]["fine_tuned_own_model"]=="models/ink-stroke-prefix-domain-v2.json"
              assert r["candidate"]["independent"]["pen_lift_f1"]>=.20
              assert r["candidate"]["independent"]["pen_lift_precision"]>=.20
              assert r["candidate"]["prefix_position"]["prefix_frame_position_error"] <= (
                 r["baseline"]["prefix_position"]["prefix_frame_position_error"]*1.06)
              print("ACCEPT: real handwritten multi-stroke pen lift generalization",flush=True)
          else:
              assert not Path("models/ink-stroke-penlift-v3.json").exists()
              print("REJECT: pen-lift quality gate not met; preserve old vector model",flush=True)
          PY
      - name: Publish evidence and only verified improved model
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/penlift-v3-metrics.json
          if test -s models/ink-stroke-penlift-v3.json; then
            git add models/ink-stroke-penlift-v3.json
          fi
          git commit -m "Validate multi-stroke pen-lift neural calibration on unseen writers"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-pen-lift-v3-validation
          path: |
            models/ink-stroke-penlift-v3.json
            models/penlift-v3-metrics.json
          if-no-files-found: ignore
