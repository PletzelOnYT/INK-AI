name: Train and measure INK AI 1.08M neural stroke V2
on:
  push:
    branches: [main]
    paths:
      - "src/train_stroke_sequence_v2.py"
      - ".github/workflows/train-stroke-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-gru-sequence-v2
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify real online handwriting dataset and GRU parameter count
        run: |
          python3 -m py_compile src/train_stroke_sequence_v2.py
          python3 tests/stroke-training-unit.py
          python3 - <<'PY'
          from src.train_stroke_sequence_v2 import SeqMDN,HIDDEN
          n=sum(p.numel() for p in SeqMDN(hidden=HIDDEN).parameters())
          assert 1_000_000<n<1_300_000,n
          print("Actual trainable recurrent parameters",n,flush=True)
          PY
      - name: Pretrain and then fine tune 1M+ pen trajectory generator
        run: |
          python -u src/train_stroke_sequence_v2.py \
             --epochs 9 --fine-epochs 3 --samples-per-epoch 18500 \
             --batch 128
      - name: Publish only genuine independently improved completion model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("models/stroke-sequence-v2-metrics.json").read_text())
          assert r["parameter_count"]>1000000
          assert r["writer_disjoint_test_samples"]>1100
          assert r["total_presentations"]>=180000
          if r["eligible"]:
              m=json.loads(Path("models/ink-stroke-sequence-v2.json").read_text())
              assert m["format"]=="ink-online-stroke-mdn-v1"
              assert m["parameter_count"]==r["parameter_count"]
              assert m["training"]["v2"] is True
              assert r["v2"]["independent"]["nll"] < r["baseline_v1"]["independent"]["nll"]
              assert r["v2"]["independent"]["pen_lift_f1"]>=r["baseline_v1"]["independent"]["pen_lift_f1"]-.02
              print("ACCEPT V2",r["parameter_count"],r["v2"],flush=True)
          else:
              assert not Path("models/ink-stroke-sequence-v2.json").exists()
              print("REJECT V2: original checkpoint retains priority",flush=True)
          PY
      - name: Publish benchmark and safe model weights to main
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/stroke-sequence-v2-metrics.json
          if test -s models/ink-stroke-sequence-v2.json; then
            git add models/ink-stroke-sequence-v2.json
          fi
          git commit -m "Publish measured 1M-parameter handwriting completion improvements"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-1m-neural-stroke-v2
          path: |
            models/ink-stroke-sequence-v2.json
            models/stroke-sequence-v2-metrics.json
          if-no-files-found: ignore
