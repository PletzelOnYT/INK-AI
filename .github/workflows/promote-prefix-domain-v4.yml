name: Promote verified handwriting GRU V4 into offline app
on:
  push:
    branches: [main]
    paths:
      - "models/ink-stroke-prefix-domain-v4.json"
      - "models/stroke-prefix-domain-v4-metrics.json"
      - ".github/workflows/promote-prefix-domain-v4.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-ai-promote-real-gru-v4
  cancel-in-progress: false
jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Determine whether new neural weights qualify for promotion
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path("models/stroke-prefix-domain-v4-metrics.json")
          w=Path("models/ink-stroke-prefix-domain-v4.json")
          if not p.exists() or not w.exists():
              print("promote=false")
          else:
              m=json.loads(p.read_text())
              allowed=(m.get("eligible") is True and
                m.get("deployable") is True and
                m.get("runtime_accepted") is True and
                not m.get("published_to_index",False))
              print("promote="+str(allowed).lower())
          PY
      - name: Build complete offline HTML with real approved V4 checkpoint
        if: steps.gate.outputs.promote == 'true'
        run: |
          python scripts/build_standalone.py
          cp dist/ink-ai-standalone.html index.html
          python - <<'PY'
          from pathlib import Path
          import re,json
          html=Path("index.html").read_text()
          m=re.search(r'<script id="inkStrokeModel" type="application/json">([\s\S]*?)</script>',html)
          assert m,"Offline model was not embedded"
          model=json.loads(m.group(1))
          assert model["training"]["prefix_domain_v4"] is True
          assert model["training"]["fine_tuned_own_model"]=="models/ink-stroke-prefix-domain-v2.json"
          assert model["parameter_count"]>300000
          print("Tested HTML embeds actual trained GRU V4 weights")
          PY
      - name: Test new neural model in actual offline Chrome
        if: steps.gate.outputs.promote == 'true'
        id: browser
        continue-on-error: true
        run: |
          python -m pip install --quiet selenium
          python tests/local-file-browser.py
          python tests/h-completion-browser.py
          python tests/completed-h-no-runaway-browser.py
          python tests/assist-manual-g-browser.py
      - name: Commit the proven model into index.html or reject failed release
        if: steps.gate.outputs.promote == 'true'
        env:
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("models/stroke-prefix-domain-v4-metrics.json")
          m=json.loads(p.read_text())
          passed=os.environ["BROWSER_RESULT"]=="success"
          m["browser_integration_passed"]=passed
          m["published_to_index"]=passed
          m["deployable"]=bool(passed)
          if not passed:
              m["browser_rejection_reason"]="New checkpoint failed offline Chrome handwriting regression"
          p.write_text(json.dumps(m,indent=2)+"\n")
          print("Promotion result:", "accepted" if passed else "rejected")
          PY
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/stroke-prefix-domain-v4-metrics.json
          if [ "$BROWSER_RESULT" = "success" ]; then
            git add index.html
          fi
          git commit -m "Record offline Chrome release decision for trained GRU V4"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
