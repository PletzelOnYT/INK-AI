name: Train and independently validate real handwritten completer V7
on:
  push:
    branches: [main]
    paths:
      - "src/train_completer_v7.py"
      - "tests/completer-v7-boundaries.py"
      - "tests/completer-v7-runtime.mjs"
      - "scripts/update_model_graphs.py"
      - ".github/workflows/train-completer-v7.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-completer-v7-real-model
  cancel-in-progress: true
jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native training dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove input matches training and no future strokes leak
        run: |
          python -m py_compile src/train_completer_v7.py
          python tests/completer-v7-boundaries.py
          node --check src/stroke_worker.js
          node tests/completer-fast-quality.mjs
          node tests/completer-no-straight-rays.mjs
      - name: Train genuine causal pen trajectory GRU from recorded writer traces
        run: |
          python -u src/train_completer_v7.py \
            --epochs 8 --samples-per-epoch 26000 --batch 96 --tail-steps 20
      - name: Validate only held-out writers, never auto-publish a regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("models/stroke-prefix-domain-v7-metrics.json").read_text())
          assert m["candidate_version"]==7
          assert m["real_independent_glyphs"]>1100
          assert m["seen"]>70000
          assert m["deployable"] is False
          assert m["requires_browser_integration"]
          if m["eligible"]:
            assert Path("models/ink-stroke-prefix-domain-v7.json").is_file()
            assert m["candidate"]["independent"]["pen_lift_f1"]>=.15
            assert m["focus"]["gain"]>=.012
            assert m["candidate"]["stop"]["precision"]>=.15
            assert m["candidate"]["stop"]["recall"]>=.20
          else:
            assert not Path("models/ink-stroke-prefix-domain-v7.json").exists()
            print("V7 rejected by unseen human writers; retaining V2",flush=True)
          PY
      - name: Validate V7 against actual neural Worker and browser before deployment
        run: |
          set -euo pipefail
          if test ! -s models/ink-stroke-prefix-domain-v7.json; then
            echo "V7 not eligible; preserve released V2"
            exit 0
          fi
          valid=1
          if ! node tests/completer-v7-runtime.mjs --require; then
            valid=0
          fi
          if [ "$valid" = 1 ]; then
            npm install --no-audit --no-fund --ignore-scripts
            npm run build:ocr
            INK_STROKE_PREVIEW_V7=1 python scripts/build_standalone.py
            cp dist/ink-ai-standalone.html index.html
            python -m pip install --quiet selenium
            if ! python tests/completed-h-no-runaway-browser.py; then valid=0; fi
            if ! python tests/glyph-completion-browser.py; then valid=0; fi
            if ! node tests/completer-no-straight-rays.mjs; then valid=0; fi
          fi
          if [ "$valid" = 1 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("models/stroke-prefix-domain-v7-metrics.json")
          m=json.loads(p.read_text())
          assert m["eligible"]
          m["browser_integration_passed"]=True
          m["deployable"]=True
          p.write_text(json.dumps(m,indent=2))
          print("V7: unseen writers + real browser accepted",flush=True)
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("models/stroke-prefix-domain-v7-metrics.json")
          m=json.loads(p.read_text())
          m["browser_integration_passed"]=False
          m["deployable"]=False
          m["rejection_reason"]="Actual neural-worker or end-to-end browser acceptance failed"
          p.write_text(json.dumps(m,indent=2))
          Path("models/ink-stroke-prefix-domain-v7.json").unlink(missing_ok=True)
          print("V7: browser rejected; released V2 unchanged",flush=True)
          PY
          fi
      - name: Publish independent metrics and only validated, deployable weights
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/update_model_graphs.py
          git add docs/recognition-vertical-bars.svg docs/completion-vertical-bars.svg
          git add models/stroke-prefix-domain-v7-metrics.json
          if python3 -c 'import json; m=json.load(open("models/stroke-prefix-domain-v7-metrics.json")); exit(0 if m.get("deployable") and m.get("browser_integration_passed") else 1)'; then
            git add index.html
          fi
          if test -s models/ink-stroke-prefix-domain-v7.json; then
            git add models/ink-stroke-prefix-domain-v7.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish independently measured V7 completer trial and any verified model"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-v7-neural-continuation-evaluation
          path: |
            models/stroke-prefix-domain-v7-metrics.json
            models/ink-stroke-prefix-domain-v7.json
          if-no-files-found: ignore
