name: Validate INK AI frontend and trainer
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "models/ink-glyph-completion-v1.json"
      - "models/ink-glyph-completion-v2.json"
      - "models/ink-cnn-v2.json"
      - "models/ink-cnn-v3.json"
      - "models/ink-stroke-sequence-v1.json"
      - "models/ink-stroke-sequence-v2.json"
      - ".github/workflows/verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python training code compiles
        run: python3 -m py_compile src/train.py src/train_stroke_sequence.py src/train_recognition_v3.py
      - name: Extract and syntax-check the embedded JavaScript and worker
        run: |
          python3 - <<'PY'
          import pathlib,re
          html=pathlib.Path("index.html").read_text()
          match=re.search(r"<script>(.*?)</script>",html,re.S)
          assert match, "Missing inline application script"
          pathlib.Path("/tmp/ink-check.js").write_text(match.group(1))
          assert "raw.githubusercontent.com/PletzelOnYT/INK-AI" in html
          assert "api.openai.com" not in html
          PY
          node --check /tmp/ink-check.js
          node tests/worker-smoke.mjs
          node tests/recognition-v2-metrics.mjs
          node tests/recognition-v3-metrics.mjs
          node --check /tmp/ink-worker-check.js
          node tests/glyph-model-smoke.mjs
          node tests/h-continuation-regression.mjs
          node tests/stroke-sequence-v2-acceptance.mjs
          node --check /tmp/ink-stroke-worker.js
          node --check src/stroke_worker.js
          node --check src/stroke_assist_ui.js

      - name: Run real Chrome smoke test (includes missing-model fallback)
        run: |
          python3 -m pip install --quiet selenium
          command -v google-chrome || command -v chromium
          python3 tests/browser-smoke.py
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/live-during-pointer-browser.py; fi
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/local-file-browser.py; fi
          python3 tests/recognition-regression-browser.py
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/glyph-completion-browser.py; fi
          if test -s models/ink-cnn-v1.json; then python3 tests/neural-browser-smoke.py; fi
