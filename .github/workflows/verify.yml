name: Validate INK AI frontend and trainer
on:
  push:
    branches: [main, "docs/model-benchmarks-graphs"]
    paths:
      - "index.html"
      - "src/index.shell.html"
      - "README.md"
      - "docs/**"
      - "src/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/package-offline.yml"
      - "tests/**"
      - "models/ink-glyph-completion-v1.json"
      - "models/ink-glyph-completion-v2.json"
      - "models/ink-cnn-v2.json"
      - "models/ink-cnn-v3.json"
      - "models/ink-stroke-sequence-v1.json"
      - "models/ink-stroke-sequence-v2.json"
      - "models/ink-stroke-prefix-v1.json"
      - "models/ink-stroke-prefix-domain-v2.json"
      - "models/ink-stroke-penlift-v3.json"
      - "models/penlift-v3-metrics.json"
      - "models/stroke-prefix-domain-v2-metrics.json"
      - ".github/workflows/verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone HTML and build offline regression fixture
        run: |
          python3 scripts/build_standalone.py
          cp dist/ink-ai-standalone.html index.html
          python3 - <<'PY'
          from pathlib import Path
          thin=Path("src/index.shell.html").read_text()
          standalone=Path("index.html").read_text()
          assert len(thin)<7000, "Editable source shell must be lightweight"
          assert len(standalone)>1400000, "Main index.html must work as single file"
          assert "src/app.js" in thin and "src/app.css" in thin
          assert "ink-cnn-int8-v1" not in thin
          assert Path("dist/ink-ai-standalone.html").stat().st_size>1400000
          main=standalone.rsplit("<script>\n",1)[-1].split("</script>",1)[0].strip()
          preference=Path("src/neural_preference_model.js").read_text().strip()
          application=Path("src/app.js").read_text().strip()
          camera=Path("src/camera_ocr.js").read_text().strip()
          expected=(Path("src/neural_preference_model.js").read_text()+"\n"+Path("src/app.js").read_text()+"\n"+Path("src/camera_ocr.js").read_text()).strip()
          assert main==expected, (
            "Downloaded index.html is out of sync with actual JS source")
          assert "function snapshot()" in standalone and "function restore(" in standalone
          print("PASS: full standalone index and lean editable shell both exist")
          PY
      - name: Verify GRU rollout, teacher importer and prefix cache
        run: |
          node --check src/stroke_worker.js
          node --check src/camera_ocr.js
          node tests/camera-local-ocr.mjs
          node tests/completer-prefix-cache.mjs
          node tests/neural-preference-learning.mjs
          node tests/completion-cnn-evidence.mjs
          python3 -m pip install --quiet "numpy>=1.26,<3"
          python3 tests/inksight-teacher-import.py
          python3 -m py_compile src/train_google_teacher_big.py

      - name: Test downloaded index.html directly in Chrome, without source files
        run: |
          python3 -m pip install --quiet selenium
          python3 tests/local-file-browser.py
          python3 tests/neural-browser-smoke.py
      - name: Switch to new generated offline HTML for remaining regressions
        run: cp dist/ink-ai-standalone.html index.html
      - name: Verify Python training code compiles
        run: python3 -m py_compile src/train.py src/train_stroke_sequence.py src/train_recognition_v3.py src/train_prefix_completion.py
      - name: Extract and syntax-check the embedded JavaScript and worker
        run: |
          python3 - <<'PY'
          import pathlib,re
          html=pathlib.Path("index.html").read_text()
          match=re.search(r"<script>(.*?)</script>",html,re.S)
          assert match, "Missing inline application script"
          pathlib.Path("/tmp/ink-check.js").write_text(match.group(1))
          assert "raw.githubusercontent.com/PletzelOnYT/INK-AI" in html
          assert "api.openai.com" not in html
          PY
          node --check /tmp/ink-check.js
          node tests/worker-smoke.mjs
          node tests/completer-prefix-cache.mjs
          node tests/recognition-v2-metrics.mjs
          node tests/recognition-v3-metrics.mjs
          node tests/readme-benchmark-evidence.mjs
          node tests/word-case-loop-unit.mjs
          node --check src/word_case_refinement.js
          node tests/lowercase-refinement-unit.mjs
          node --check src/recognition_refinement.js
          node --check /tmp/ink-worker-check.js
          node tests/glyph-model-smoke.mjs
          node tests/h-continuation-regression.mjs
          node tests/rollout-candidate-diagnostics.mjs
          node tests/neural-rollout-quality.mjs
          node tests/continuation-context-quality.mjs
          node tests/stroke-sequence-v2-acceptance.mjs
          node tests/prefix-quality-acceptance.mjs
          node tests/prefix-domain-quality.mjs
          node tests/penlift-v3-quality.mjs
          node --check /tmp/ink-stroke-worker.js
          node --check src/stroke_worker.js
          node --check src/stroke_assist_ui.js

      - name: Run real Chrome smoke test (includes missing-model fallback)
        run: |
          python3 -m pip install --quiet selenium
          command -v google-chrome || command -v chromium
          python3 tests/camera-colors-browser.py
          python3 tests/browser-smoke.py
          python3 tests/assist-manual-g-browser.py
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/live-during-pointer-browser.py; fi
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/local-file-browser.py; fi
          python3 tests/recognition-regression-browser.py
          python3 tests/word-case-loop-browser.py
          python3 tests/lowercase-recognition-browser.py
          python3 tests/continuation-offline-browser.py
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/h-completion-browser.py; fi
          python3 tests/completed-h-no-runaway-browser.py
          if test -s models/ink-stroke-sequence-v1.json; then python3 tests/glyph-completion-browser.py; fi
          if test -s models/ink-cnn-v1.json; then python3 tests/neural-browser-smoke.py; fi
