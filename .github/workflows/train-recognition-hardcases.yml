name: Retrain recognizer on confusing handwritten characters
on:
  push:
    branches: [main]
    paths:
      - "src/train_recognition_hardcases.py"
      - ".github/workflows/train-recognition-hardcases.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ink-ai-recognition-hardcases
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate CNN training script
        run: python -m py_compile src/train_recognition_hardcases.py
      - name: Train targeted hard-case CNN on real handwritten datasets
        run: python -u src/train_recognition_hardcases.py --epochs 9 --samples-per-epoch 96000 --batch 192
      - name: Check independent-writer improvement and 90 percent goal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("models/recognition-v5-metrics.json").read_text())
          assert m["uji_independent_glyphs"]>=1100
          assert m["baseline_v2"]["pen_independent"]["tested"]>=1100
          if m["eligible"]:
              assert Path("models/ink-cnn-v5.json").is_file()
              assert m["independent_pen_v3"]["overall"]>=m["baseline_v2"]["pen_independent"]["overall"]+.005
              assert m["independent_pen_v3"]["hard_macro"]>=m["baseline_v2"]["pen_independent"]["hard_macro"]+.02
          print("Independent-writer accuracy:",m["independent_pen_v3"])
          print("90 percent goal met:",m["target_reached"])
          PY
      - name: Commit only evaluated metrics and accepted weights
        run: |
          git config user.name "ink-ai-training[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/recognition-v5-metrics.json
          if test -s models/ink-cnn-v5.json; then git add models/ink-cnn-v5.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record measured hard-case CNN training evidence"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Build distributable offline HTML
        run: python scripts/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: ink-ai-standalone-after-recognition-training
          path: dist/ink-ai-standalone.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ink-ai-hardcase-evidence
          path: |
            models/recognition-v5-metrics.json
            models/ink-cnn-v5.json
          if-no-files-found: ignore
