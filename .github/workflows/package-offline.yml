name: Package self-contained offline INK AI
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/index.shell.html"
      - "src/app.js"
      - "src/camera_ocr.js"
      - "src/camera_offline_bridge.js"
      - "src/camera_offline_engine_entry.mjs"
      - "scripts/build_offline_ocr.mjs"
      - "package.json"
      - "src/camera_line_runtime.js"
      - "models/ink-native-line-ctc-v1.json"
      - "src/camera_text_detector.js"
      - "src/camera_tracking.js"
      - "src/train_print_cnn.py"
      - "models/ink-print-cnn-v1.json"
      - "models/print-cnn-v1-metrics.json"
      - "models/recognition-v3-metrics.json"
      - "models/stroke-prefix-domain-v2-metrics.json"
      - ".github/workflows/package-offline.yml"
      - "src/app.css"
      - "src/stroke_worker.js"
      - "scripts/build_standalone.py"
      - "models/ink-cnn-v3.json"
      - "models/ink-cnn-v5.json"
      - "models/ink-stroke-prefix-domain-v2.json"
      - "models/ink-stroke-prefix-domain-v3.json"
      - "models/ink-stroke-prefix-domain-v4.json"
      - "models/ink-stroke-lift-aware-v5.json"
      - "models/recurrent-lift-v5-metrics.json"
      - "models/ink-stroke-natural-v4.json"
      - "models/stroke-natural-v4-metrics.json"
      - "models/stroke-prefix-domain-v4-metrics.json"
      - "models/stroke-prefix-domain-v3-metrics.json"
      - "models/ink-stroke-sequence-v1.json"
      - "data/english-words.txt"
  workflow_dispatch:
concurrency:
  group: ink-offline-html-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and embed offline pretrained OCR
        run: |
          git fetch origin main
          git reset --hard origin/main
          {
            npm install --no-audit --no-fund --ignore-scripts
            npm run build:ocr
            python3 scripts/build_standalone.py
          } 2>&1 | tee /tmp/ink-offline-ocr-build.log
      - name: Preserve the actual build error when packaging fails
        if: failure()
        run: |
          mkdir -p docs
          {
            echo "# Offline OCR build failed"
            echo
            echo "GitHub Actions could not produce the embedded WASM model."
            echo "The existing index.html was NOT replaced."
            echo
            echo '---'
            echo
            echo '## Last build messages'
            echo
            echo '~~~text'
            tail -n 65 /tmp/ink-offline-ocr-build.log 2>/dev/null || echo "Build log unavailable"
            echo '~~~'
          } > docs/offline-ocr-build-error.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/offline-ocr-build-error.md
          if ! git diff --cached --quiet; then
            git commit -m "Record offline OCR packaging failure for debugging"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Update downloadable index.html
        run: |
          cp dist/ink-ai-standalone.html index.html
          rm -f docs/offline-ocr-build-error.md
          git add index.html
          git add -u docs/offline-ocr-build-error.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild root standalone HTML"
            # Other CI jobs may publish their test report while this large
            # offline bundle is compiling. Rebase rather than lose the HTML
            # update to a non-fast-forward push race.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
