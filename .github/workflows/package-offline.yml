name: Package self-contained offline INK AI
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/index.shell.html"
      - "src/app.js"
      - "src/camera_ocr.js"
      - "src/camera_text_detector.js"
      - "src/camera_tracking.js"
      - "src/train_print_cnn.py"
      - "models/ink-print-cnn-v1.json"
      - "models/print-cnn-v1-metrics.json"
      - "models/recognition-v3-metrics.json"
      - "models/stroke-prefix-domain-v2-metrics.json"
      - ".github/workflows/package-offline.yml"
      - "src/app.css"
      - "src/stroke_worker.js"
      - "scripts/build_standalone.py"
      - "models/ink-cnn-v3.json"
      - "models/ink-cnn-v5.json"
      - "models/ink-stroke-prefix-domain-v2.json"
      - "models/ink-stroke-prefix-domain-v3.json"
      - "models/ink-stroke-prefix-domain-v4.json"
      - "models/ink-stroke-lift-aware-v5.json"
      - "models/recurrent-lift-v5-metrics.json"
      - "models/ink-stroke-natural-v4.json"
      - "models/stroke-natural-v4-metrics.json"
      - "models/stroke-prefix-domain-v4-metrics.json"
      - "models/stroke-prefix-domain-v3-metrics.json"
      - "models/ink-stroke-sequence-v1.json"
      - "data/english-words.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/build_standalone.py
      - name: Update downloadable index.html
        run: |
          cp dist/ink-ai-standalone.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild root standalone HTML"
            git push origin HEAD:main
          fi
