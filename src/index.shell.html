<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>INK AI</title>
<link rel="stylesheet" href="./src/app.css">

</head>
<body>
<main>
  <div class="tools" role="toolbar" aria-label="Drawing tools">
    <button id="pen" class="tool" type="button" aria-label="Pen" title="Pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4-12 12H4v-4L16 4Z"/><path d="m14 6 4 4"/></svg></button>
    <button id="eraser" class="tool" type="button" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.8 13.3-7.4 7.4H7.1l-3.6-3.6a2 2 0 0 1 0-2.8L14.2 3.6a2 2 0 0 1 2.8 0l3.8 3.8a2 2 0 0 1 0 2.8Z"/><path d="m9.5 8.3 7.2 7.2M13.4 20.7H21"/></svg></button>
    <button id="assist" class="tool" type="button" aria-label="Experimental neural stroke completion" title="AI completes handwritten letters, numbers and symbols · press G to accept" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17Z"/></svg></button>
    <button id="camera" class="tool" type="button" aria-label="Camera text reader" title="Read text with webcam" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h-4l-2 3H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-4l-2-3Z"/><circle cx="12" cy="14" r="3.5"/></svg></button>
  </div>
  <div class="board">
    <canvas id="pad" width="1200" height="550" data-tool="pen" aria-label="Write or draw here"></canvas>
    <canvas id="ghost" width="1200" height="550" aria-hidden="true"></canvas>
    <video id="cameraVideo" autoplay muted playsinline aria-label="Live camera preview"></video>
    <canvas id="cameraHighlights" aria-hidden="true"></canvas>
  </div>
  <div id="guess" data-muted="true" aria-live="polite">Loading AI…</div>
</main>
<script src="./src/neural_preference_model.js"></script>
<script src="./src/app.js" defer></script>
<script src="./src/camera_ocr.js" defer></script>
</body>
</html>
